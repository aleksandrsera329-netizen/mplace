!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мои RFQ — Mplace Energy</title>
  <base href="/" />

  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-header h1 {
      font-size: 1.9rem;
      font-weight: 800;
    }

    .btn-create {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-create:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
    }

    .rfq-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .rfq-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      transition: all 0.25s;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      display: block;
    }
    .rfq-card:hover {
      border-color: rgba(245, 158, 11, 0.5);
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .rfq-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .rfq-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .rfq-number {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-OPEN { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .status-MATCHED { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
    .status-QUOTED { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .status-AWARDED { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-CLOSED { background: rgba(156, 163, 175, 0.15); color: #9ca3af; }
    .status-CANCELLED { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .rfq-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .state-block {
      text-align: center;
      padding: 80px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle">🌙</button>
        <div id="localeMount"></div>
        <a href="/account.html" class="icon-btn">👤</a>
      </div>
    </div>
  </header>

  <div class="page">
    <div class="page-header">
      <h1>Мои RFQ</h1>
      <a href="/rfq-create.html" class="btn-create">+ Создать RFQ</a>
    </div>

    <div id="rfqsContent">
      <div style="text-align:center; padding:60px 0; opacity:0.6;">Загрузка...</div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>

  <script>
    const I = window.MplaceI18n;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    I.mountSwitcher('#localeMount');

    function getStatusText(status) {
      const map = {
        OPEN: 'Открыт',
        MATCHED: 'Поиск поставщиков',
        QUOTED: 'Есть предложения',
        AWARDED: 'Выбран победитель',
        CLOSED: 'Закрыт',
        CANCELLED: 'Отменён'
      };
      return map[status] || status;
    }

    async function loadRfqs() {
      const content = document.getElementById('rfqsContent');
      const token = MplaceApi.getToken?.() || sessionStorage.getItem('mplace_token');

      if (!token) {
        content.innerHTML = `
          <div class="state-block">
            <div style="font-size:3.5rem; margin-bottom:16px; opacity:0.5;">🔒</div>
            <h2>Требуется вход</h2>
            <p style="color:var(--text-muted); margin:12px 0 28px;">Войдите, чтобы видеть свои RFQ</p>
            <a href="/login.html" class="btn-create">Войти</a>
          </div>
        `;
        return;
      }

      try {
        const res = await MplaceApi.rfqs();
        const list = Array.isArray(res) ? res : (res.items || res.data || []);

        if (list.length === 0) {
          content.innerHTML = `
            <div class="state-block">
              <div style="font-size:3.5rem; margin-bottom:16px; opacity:0.5;">📋</div>
              <h2>RFQ пока нет</h2>
              <p style="color:var(--text-muted); margin:12px 0 28px;">Создайте первый запрос предложений</p>
              <a href="/rfq-create.html" class="btn-create">+ Создать RFQ</a>
            </div>
          `;
          return;
        }

        content.innerHTML = `
          <div class="rfq-list">
            ${list.map(rfq => `
              <a href="/rfq.html?id=${rfq.id}" class="rfq-card">
                <div class="rfq-top">
                  <div>
                    <div class="rfq-title">${rfq.title || 'Без названия'}</div>
                    <div class="rfq-number">${rfq.number || rfq.id}</div>
                  </div>
                  <div class="status-badge status-${rfq.status || 'OPEN'}">
                    ${getStatusText(rfq.status)}
                  </div>
                </div>
                <div class="rfq-meta">
                  <span>Позиций: ${rfq.items?.length || rfq.itemsCount || '—'}</span>
                  <span>Создан: ${rfq.createdAt ? new Date(rfq.createdAt).toLocaleDateString('ru-RU') : '—'}</span>
                  ${rfq.deadline ? `<span>До: ${new Date(rfq.deadline).toLocaleDateString('ru-RU')}</span>` : ''}
                </div>
              </a>
            `).join('')}
          </div>
        `;
      } catch (err) {
        console.error(err);
        content.innerHTML = `
          <div class="state-block">
            <div style="font-size:3.5rem; margin-bottom:16px; opacity:0.5;">⚠️</div>
            <h2>Ошибка загрузки</h2>
            <p style="color:var(--text-muted); margin:12px 0 28px;">Не удалось получить список RFQ</p>
            <button class="btn-create" onclick="loadRfqs()">Попробовать снова</button>
          </div>
        `;
      }
    }

    loadRfqs();
  </script>
</body>
</html>
