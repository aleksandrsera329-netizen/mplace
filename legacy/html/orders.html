<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мои заявки — Mplace Energy</title>
  <base href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />
  <style>
    .orders-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 28px 80px;
      position: relative;
      z-index: 1;
    }
    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .orders-header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      transition: all 0.25s;
      cursor: pointer;
    }
    .order-card:hover {
      border-color: rgba(245, 158, 11, 0.45);
      background: var(--card-hover);
      transform: translateY(-2px);
    }
    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .order-number {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .order-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-new { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .status-processing { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .status-completed { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-cancelled { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .order-meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      font-size: 0.95rem;
      color: var(--text-muted);
      align-items: center;
    }
    .order-total {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent);
      margin-left: auto;
    }
    .state-block {
      text-align: center;
      padding: 90px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
    }
    .state-block .icon {
      font-size: 4.5rem;
      margin-bottom: 24px;
      opacity: 0.5;
    }
    .state-block h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    .state-block p {
      color: var(--text-muted);
      margin-bottom: 32px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn-primary {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 14px 32px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.45);
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button type="button" class="theme-btn" id="themeToggle" title="Тема">🌙</button>
        <div id="localeMount"></div>
        <a class="icon-btn" href="/login.html" title="Аккаунт">👤</a>
        <a class="cart-btn" href="/cart.html" style="text-decoration:none;">
          🛒 <span data-i18n="nav.cart">Корзина</span>
        </a>
      </div>
    </div>
  </header>

  <div class="orders-page">
    <div class="orders-header">
      <h1>Мои заявки</h1>
      <a href="/" class="btn-primary" style="padding:10px 20px;font-size:0.9rem">В каталог</a>
    </div>

    <div id="ordersContent">
      <div style="text-align:center; padding:80px 0; opacity:0.6;" data-i18n="common.loading">Загрузка...</div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;

    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    I.mountSwitcher('#localeMount');

    // Token is stored in sessionStorage as mplace_token (see api.js setSession)
    function isLoggedIn() {
      return !!(window.MplaceApi && MplaceApi.getToken && MplaceApi.getToken());
    }

    // Matches Prisma OrderStatus enum
    function getStatusInfo(status) {
      const map = {
        PENDING_PAYMENT:   { text: 'Ожидает оплаты', class: 'status-new' },
        PAID:              { text: 'Оплачена', class: 'status-processing' },
        PROCESSING:        { text: 'В обработке', class: 'status-processing' },
        SHIPPED:           { text: 'Отправлена', class: 'status-completed' },
        COMPLETED:         { text: 'Завершена', class: 'status-completed' },
        CANCELLED:         { text: 'Отменена', class: 'status-cancelled' },
        DISPUTED:          { text: 'Спор', class: 'status-cancelled' },
        REFUNDED:          { text: 'Возврат', class: 'status-cancelled' },
        PARTIALLY_REFUNDED:{ text: 'Частичный возврат', class: 'status-processing' },
        // legacy aliases if any
        NEW:               { text: 'Новая', class: 'status-new' },
        PENDING:           { text: 'Ожидает', class: 'status-new' },
        CONFIRMED:         { text: 'Подтверждена', class: 'status-processing' },
        REJECTED:          { text: 'Отклонена', class: 'status-cancelled' },
      };
      return map[status] || { text: status || 'Неизвестно', class: 'status-new' };
    }

    async function loadOrders() {
      const content = document.getElementById('ordersContent');

      if (!isLoggedIn()) {
        content.innerHTML = `
          <div class="state-block">
            <div class="icon">🔒</div>
            <h2>Требуется вход</h2>
            <p>Чтобы просматривать историю своих заявок, пожалуйста, войдите в аккаунт</p>
            <a href="/login.html?next=/orders.html" class="btn-primary">Войти</a>
          </div>
        `;
        return;
      }

      try {
        const orders = await MplaceApi.orders();
        const list = Array.isArray(orders) ? orders : (orders.items || orders.data || []);

        if (list.length === 0) {
          content.innerHTML = `
            <div class="state-block">
              <div class="icon">📋</div>
              <h2>Заявок пока нет</h2>
              <p>Вы ещё не создали ни одной заявки. Перейдите в каталог и добавьте оборудование.</p>
              <a href="/" class="btn-primary">Перейти в каталог</a>
            </div>
          `;
          return;
        }

        const e = typeof escapeHtml === 'function' ? escapeHtml : (s) => String(s ?? '');
        const a = typeof escapeAttr === 'function' ? escapeAttr : e;
        content.innerHTML = `
          <div class="orders-list">
            ${list.map((order) => {
              const status = getStatusInfo(order.status);
              const date = order.createdAt
                ? new Date(order.createdAt).toLocaleDateString('ru-RU', {
                    day: 'numeric', month: 'long', year: 'numeric',
                    hour: '2-digit', minute: '2-digit',
                  })
                : '—';
              const itemsCount = order._count?.items ?? order.items?.length ?? '—';
              const shop = order.shop?.name || '';

              return `
                <div class="order-card" data-id="${a(order.id)}">
                  <div class="order-top">
                    <div>
                      <div class="order-number">${e(order.orderNumber || order.id)}</div>
                      <div style="font-size:0.9rem; color:var(--text-muted); margin-top:4px;">${e(date)}</div>
                    </div>
                    <div class="order-status ${e(status.class)}">${e(status.text)}</div>
                  </div>
                  <div class="order-meta">
                    ${shop ? `<div>Поставщик: <strong>${e(shop)}</strong></div>` : ''}
                    <div>Позиций: <strong>${e(itemsCount)}</strong></div>
                    <div class="order-total">${e(I.formatMoney(order.totalCents || order.subtotalCents || 0))}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

        content.querySelectorAll('.order-card').forEach((card) => {
          card.addEventListener('click', () => {
            const id = card.getAttribute('data-id');
            // Detail page can be added later; for now open order API view via query
            location.href = '/order.html?id=' + encodeURIComponent(id);
          });
        });
      } catch (err) {
        console.error(err);

        if (err.status === 401 || /401|Unauthorized|jwt|token/i.test(String(err.message || ''))) {
          content.innerHTML = `
            <div class="state-block">
              <div class="icon">🔒</div>
              <h2>Сессия истекла</h2>
              <p>Пожалуйста, войдите в аккаунт заново</p>
              <a href="/login.html?next=/orders.html" class="btn-primary">Войти</a>
            </div>
          `;
        } else {
          const e = typeof escapeHtml === 'function' ? escapeHtml : (s) => String(s ?? '');
          content.innerHTML = `
            <div class="state-block">
              <div class="icon">⚠️</div>
              <h2>Ошибка загрузки</h2>
              <p>${e(err.message || 'Не удалось получить список заявок')}</p>
              <button type="button" class="btn-primary" id="retryOrders">Попробовать снова</button>
            </div>
          `;
          document.getElementById('retryOrders')?.addEventListener('click', loadOrders);
        }
      }
    }

    loadOrders();
  </script>
</body>
</html>
