<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Заявка — Mplace Energy</title>
  <base href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />
  <style>
    .cart-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 28px 80px;
      position: relative;
      z-index: 1;
    }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .cart-header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 40px;
      align-items: start;
    }
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .cart-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 20px;
      align-items: center;
      transition: all 0.25s;
    }
    .cart-item:hover {
      border-color: rgba(245, 158, 11, 0.4);
      background: var(--card-hover);
    }
    .cart-item-image {
      width: 100px;
      height: 100px;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      overflow: hidden;
    }
    [data-theme="light"] .cart-item-image {
      background: linear-gradient(160deg, #e2e8f0, #f8fafc);
    }
    .cart-item-image img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }
    .cart-item-info h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .cart-item-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qty-control button {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .qty-control button:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .qty-control span {
      font-weight: 700;
      min-width: 28px;
      text-align: center;
    }
    .cart-item-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }
    .item-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
    }
    .btn-remove {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .btn-remove:hover { color: var(--danger); }
    .cart-summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      position: sticky;
      top: 100px;
    }
    .cart-summary h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 1rem;
    }
    .summary-row.total {
      font-size: 1.4rem;
      font-weight: 800;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .summary-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 28px;
    }
    .btn-checkout {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
      width: 100%;
    }
    .btn-checkout:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.45);
    }
    .btn-checkout:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-continue {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      text-align: center;
      transition: all 0.25s;
      text-decoration: none;
      display: block;
    }
    .btn-continue:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .empty-cart {
      text-align: center;
      padding: 100px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
    }
    .empty-cart .icon {
      font-size: 5rem;
      margin-bottom: 24px;
      opacity: 0.4;
    }
    .empty-cart h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    .empty-cart p {
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .form-field {
      margin-bottom: 14px;
    }
    .form-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    .form-field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .checkout-msg {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
    }
    .checkout-msg.show { display: block; }
    .checkout-msg.error {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    .checkout-msg.ok {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid var(--success);
      color: var(--success);
    }
    .checkout-msg.warn {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--primary);
      color: var(--text);
      font-size: 0.85rem;
    }
    .pay-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 8px 0 0;
      line-height: 1.45;
    }
    @media (max-width: 900px) {
      .cart-layout { grid-template-columns: 1fr; }
      .cart-item {
        grid-template-columns: 80px 1fr;
        grid-template-rows: auto auto;
      }
      .cart-item-right {
        grid-column: 1 / -1;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
      }
      .cart-summary { position: static; }
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button type="button" class="theme-btn" id="themeToggle" title="Тема">🌙</button>
        <div id="localeMount"></div>
        <a class="icon-btn" href="/login.html" title="Аккаунт">👤</a>
        <button type="button" class="cart-btn" id="cartBtn">
          🛒 <span data-i18n="nav.cart">Корзина</span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="cart-page">
    <div class="cart-header">
      <h1 data-i18n="cart.title">Ваша заявка</h1>
      <button type="button" class="btn-remove" id="clearCartBtn" style="display:none;">Очистить заявку</button>
    </div>

    <div id="cartContent">
      <div style="text-align:center; padding:80px 0; opacity:0.6;" data-i18n="common.loading">Загрузка заявки...</div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');

    I.mountSwitcher('#localeMount');

    document.getElementById('cartBtn').onclick = () => location.reload();
    document.getElementById('clearCartBtn').onclick = clearCart;

    function unitPrice(item) {
      return item.product?.priceCents ?? item.priceCents ?? 0;
    }

    async function loadCart() {
      try {
        const cart = await MplaceApi.cart();
        renderCart(cart);
        I.applyDocument();
      } catch (err) {
        console.error(err);
        const e = typeof escapeHtml === 'function' ? escapeHtml : (s) => String(s ?? '');
        document.getElementById('cartContent').innerHTML = `
          <div class="empty-cart">
            <div class="icon">⚠️</div>
            <h2>Ошибка загрузки</h2>
            <p>${e(err.message || 'Не удалось загрузить заявку')}</p>
            <a href="/" class="btn-checkout" style="display:inline-block; text-decoration:none; width:auto; padding:14px 28px;">Вернуться в каталог</a>
          </div>
        `;
      }
    }

    function safeImgUrl(url) {
      const raw = String(url || '');
      if (!/^(https?:|\/|data:image\/)/i.test(raw)) return '';
      return typeof escapeAttr === 'function' ? escapeAttr(raw) : raw.replace(/"/g, '&quot;');
    }

    function renderCart(cart) {
      const content = document.getElementById('cartContent');
      const clearBtn = document.getElementById('clearCartBtn');
      document.getElementById('cartCount').textContent = cart.itemCount || 0;
      const e = typeof escapeHtml === 'function' ? escapeHtml : (s) => String(s ?? '');
      const a = typeof escapeAttr === 'function' ? escapeAttr : e;

      if (!cart.items || cart.items.length === 0) {
        clearBtn.style.display = 'none';
        content.innerHTML = `
          <div class="empty-cart">
            <div class="icon">🛒</div>
            <h2 data-i18n="cart.empty">Заявка пуста</h2>
            <p>Добавьте оборудование из каталога, чтобы сформировать заявку</p>
            <a href="/" class="btn-checkout" style="display:inline-block; text-decoration:none; width:auto; padding:14px 28px;" data-i18n="cart.shopNow">Перейти в каталог</a>
          </div>
        `;
        return;
      }

      clearBtn.style.display = 'block';

      const itemsHtml = cart.items.map((item) => {
        const p = item.product || {};
        const unit = unitPrice(item);
        const line = unit * item.quantity;
        const imgSrc = safeImgUrl(p.imageUrl);
        return `
          <div class="cart-item" data-id="${a(item.id)}">
            <div class="cart-item-image">
              ${imgSrc ? `<img src="${imgSrc}" alt="">` : '🛢️'}
            </div>
            <div class="cart-item-info">
              <h3><a href="/product.html?id=${encodeURIComponent(p.slug || p.id || '')}" style="color:inherit">${e(p.name || 'Товар')}</a></h3>
              <div class="cart-item-meta">
                ${e(p.shop?.name || '')} · SKU: ${e(p.sku || '—')}
              </div>
              <div class="qty-control">
                <button type="button" data-qty="${a(item.id)}" data-delta="-1">−</button>
                <span>${e(item.quantity)}</span>
                <button type="button" data-qty="${a(item.id)}" data-delta="1" data-cur="${e(item.quantity)}">+</button>
              </div>
            </div>
            <div class="cart-item-right">
              <div class="item-price">${e(I.formatMoney(line))}</div>
              <button type="button" class="btn-remove" data-remove="${a(item.id)}">Удалить</button>
            </div>
          </div>
        `;
      }).join('');

      content.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items">
            ${itemsHtml}
          </div>

          <div class="cart-summary">
            <h2 data-i18n="cart.checkoutBox">Итого по заявке</h2>
            <div class="summary-row">
              <span>Товаров</span>
              <span>${cart.itemCount}</span>
            </div>
            <div class="summary-row">
              <span>Позиций</span>
              <span>${cart.items.length}</span>
            </div>
            <div class="summary-row total">
              <span data-i18n="cart.subtotal">Сумма</span>
              <span>${I.formatMoney(cart.subtotalCents || 0)}</span>
            </div>

            <div class="summary-actions">
              <a href="/checkout.html" class="btn-checkout" style="text-decoration:none; text-align:center;" data-i18n="cart.payBtn">Оформить заявку</a>
              <a href="/" class="btn-continue" data-i18n="nav.continueShopping">Продолжить покупки</a>
            </div>
          </div>
        </div>
      `;

      content.querySelectorAll('[data-qty]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-qty');
          const delta = parseInt(btn.getAttribute('data-delta'), 10);
          const row = cart.items.find((i) => i.id === id);
          if (!row) return;
          await updateQty(id, row.quantity + delta);
        });
      });
      content.querySelectorAll('[data-remove]').forEach((btn) => {
        btn.addEventListener('click', () => removeItem(btn.getAttribute('data-remove')));
      });
    }

    async function updateQty(itemId, newQty) {
      if (newQty < 1) return removeItem(itemId);
      try {
        await MplaceApi.updateCartItem(itemId, newQty);
        await loadCart();
      } catch (e) {
        alert(e.message || 'Не удалось изменить количество');
      }
    }

    async function removeItem(itemId) {
      try {
        // API: quantity <= 0 deletes the line item
        await MplaceApi.updateCartItem(itemId, 0);
        await loadCart();
      } catch (e) {
        alert(e.message || 'Не удалось удалить товар');
      }
    }

    async function clearCart() {
      if (!confirm('Очистить всю заявку?')) return;
      try {
        await MplaceApi.clearCart();
        await loadCart();
      } catch (e) {
        alert(e.message || 'Ошибка очистки');
      }
    }

    window.addEventListener('mplace:locale', () => {
      I.applyDocument();
      loadCart();
    });

    loadCart();
  </script>
</body>
</html>
