<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace — Избранное</title>

  <link rel="stylesheet" href="/assets/css/store-modern.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.25s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: var(--shadow);
    }

    .product-image {
      height: 160px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
    }
    [data-theme="light"] .product-image {
      background: linear-gradient(135deg, #e2e8f0, #f1f5f9);
    }
    .product-image img {
      max-height: 100px;
      max-width: 90%;
      object-fit: contain;
    }

    .product-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .product-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; }
    .product-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
    .product-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .product-price { font-size: 1.15rem; font-weight: 700; color: var(--accent); }

    .btn-sm {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #000;
    }
    .btn-sm.outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-sm.danger { background: #ef4444; color: #fff; }

    .btn {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn.outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<header class="store-header">
  <div class="header-top">
    <a class="logo" href="/">M<span>place</span> Energy</a>
    <div class="header-actions">
      <button class="theme-btn" id="themeToggle" type="button">🌙</button>
      <div id="localeMount"></div>
      <a class="icon-btn" href="/wishlist.html" title="Избранное">♥</a>
      <a class="icon-btn" href="/account.html" title="Аккаунт">👤</a>
    </div>
  </div>
</header>

<div class="page">
  <div class="page-header">
    <div>
      <h1 style="margin:0;font-size:1.5rem;">Избранное</h1>
      <div style="color:var(--text-muted);font-size:0.9rem;margin-top:4px;" id="countText">Загрузка…</div>
    </div>
    <a class="btn outline" href="/account.html">← В кабинет</a>
  </div>

  <div id="content">
    <div class="empty">Загрузка…</div>
  </div>
</div>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/api.js"></script>
<script>
  const I = window.MplaceI18n;

  const themeToggle = document.getElementById('themeToggle');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('mplace_theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  themeToggle.onclick = () =>
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  setTheme(localStorage.getItem('mplace_theme') || 'dark');
  if (I && I.mountSwitcher) I.mountSwitcher('#localeMount');

  function getToken() {
    return (window.MplaceApi && MplaceApi.getToken && MplaceApi.getToken())
      || sessionStorage.getItem('mplace_token')
      || localStorage.getItem('mplace_token')
      || '';
  }

  function money(cents) {
    if (I && I.formatMoney) return I.formatMoney(cents || 0);
    return '$' + ((cents || 0) / 100).toFixed(2);
  }

  // Stage 21: full HTML escape (prefer global from api.js)
  function esc(s) {
    if (typeof escapeHtml === 'function') return escapeHtml(s);
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function api(path, opts = {}) {
    const token = getToken();
    const base = (window.MplaceApi && MplaceApi.getBase && MplaceApi.getBase()) || (location.origin + '/api');
    const res = await fetch(base + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        ...(opts.headers || {})
      }
    });
    if (res.status === 401) {
      location.href = '/login.html?email=customer@demo.com&next=/wishlist.html';
      throw new Error('Unauthorized');
    }
    if (!res.ok) {
      let err = await res.text();
      try {
        const j = JSON.parse(err);
        err = Array.isArray(j.message) ? j.message.join(', ') : (j.message || err);
      } catch (_) {}
      throw new Error(typeof err === 'string' ? err : JSON.stringify(err));
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function loadWishlist() {
    const content = document.getElementById('content');
    try {
      const data = await api('/wishlist');
      const items = Array.isArray(data) ? data : (data.items || []);

      document.getElementById('countText').textContent = items.length + ' товаров';

      if (!items.length) {
        content.innerHTML = `
          <div class="empty">
            <div style="font-size:3rem;margin-bottom:12px;">♡</div>
            <div>В избранном пока пусто</div>
            <a class="btn" href="/" style="margin-top:20px;">Перейти в каталог</a>
          </div>`;
        return;
      }

      content.innerHTML = `
        <div class="products-grid">
          ${items.map(item => {
            const p = item.product || item;
            const rawImg = String(p.imageUrl || '');
            const safeImg = /^(https?:|\/|data:image\/)/i.test(rawImg)
              ? (typeof escapeAttr === 'function' ? escapeAttr(rawImg) : esc(rawImg))
              : '';
            const img = safeImg
              ? `<img src="${safeImg}" alt="${esc(p.name)}" loading="lazy">`
              : '🛢️';
            return `
              <article class="product-card">
                <div class="product-image">${img}</div>
                <div class="product-body">
                  <div class="product-title">${esc(p.name)}</div>
                  <div class="product-meta">${esc(p.shop?.name || '')} · ${esc(p.category?.name || '')}</div>
                  <div class="product-footer">
                    <div class="product-price">${money(p.priceCents)}</div>
                    <div>
                      <button type="button" class="btn-sm" onclick="location.href='/product.html?id=${esc(p.id)}'">Открыть</button>
                      <button type="button" class="btn-sm danger" onclick="removeFromWishlist('${esc(p.id)}')">Удалить</button>
                    </div>
                  </div>
                </div>
              </article>
            `;
          }).join('')}
        </div>`;
    } catch (e) {
      content.innerHTML = `<div class="empty" style="color:#ef4444;">Ошибка: ${esc(e.message)}</div>`;
    }
  }

  async function removeFromWishlist(productId) {
    if (!confirm('Убрать из избранного?')) return;
    try {
      await api('/wishlist/' + productId, { method: 'DELETE' });
      loadWishlist();
    } catch (e) {
      alert('Ошибка: ' + e.message);
    }
  }

  if (!getToken()) {
    location.href = '/login.html?email=customer@demo.com&next=/wishlist.html';
  } else {
    loadWishlist();
  }
</script>
</body>
</html>
