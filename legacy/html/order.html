<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Заявка — Mplace Energy</title>
  <base href="/" />

  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .order-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .order-number {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .order-date {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .status-PENDING_PAYMENT { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .status-PAID { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-PROCESSING { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .status-SHIPPED { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
    .status-COMPLETED { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-CANCELLED { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .status-DISPUTED { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .status-REFUNDED, .status-PARTIALLY_REFUNDED { background: rgba(156, 163, 175, 0.15); color: #9ca3af; }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 32px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
    }
    .items-table th {
      text-align: left;
      padding: 12px 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .items-table td {
      padding: 16px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .items-table tr:last-child td {
      border-bottom: none;
    }

    .item-name {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }
    .summary-row.total {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .info-grid {
      display: grid;
      gap: 14px;
    }
    .info-item span {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .timeline {
      position: relative;
      padding-left: 24px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--border);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 20px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -21px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--card);
    }
    .timeline-item:last-child {
      margin-bottom: 0;
    }
    .timeline-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .state-block {
      text-align: center;
      padding: 80px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    @media (max-width: 800px) {
      .order-grid {
        grid-template-columns: 1fr;
      }
      .order-number {
        font-size: 1.5rem;
      }
      .items-table {
        display: block;
      }
      .items-table thead {
        display: none;
      }
      .items-table tr {
        display: block;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .items-table td {
        display: block;
        padding: 4px 0;
        border: none;
      }
    }
      .btn-primary {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle">🌙</button>
        <div id="localeMount"></div>
        <a class="icon-btn" href="/login.html">👤</a>
        <a href="/orders.html" class="cart-btn" style="text-decoration:none;">Мои заявки</a>
      </div>
    </div>
  </header>

  <div class="order-page">
    <div id="orderContent">
      <div style="text-align:center; padding:80px 0; opacity:0.6;">Загрузка заявки...</div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>

  <script>
    const I = window.MplaceI18n;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    I.mountSwitcher('#localeMount');

    function getStatusText(status) {
      const map = {
        PENDING_PAYMENT: 'Ожидает оплаты',
        PAID: 'Оплачена',
        PROCESSING: 'В обработке',
        SHIPPED: 'Отправлена',
        COMPLETED: 'Завершена',
        CANCELLED: 'Отменена',
        DISPUTED: 'Спор',
        REFUNDED: 'Возврат',
        PARTIALLY_REFUNDED: 'Частичный возврат'
      };
      return map[status] || status;
    }

    function getOrderIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || params.get('orderId');
    }

    async function loadOrder() {
      const orderId = getOrderIdFromUrl();
      if (!orderId) {
        showError('Не указан номер заявки');
        return;
      }

      try {
        const order = await MplaceApi.order(orderId);
        renderOrder(order);
        document.title = `Заявка ${order.orderNumber} — Mplace Energy`;
      } catch (err) {
        console.error(err);
        if (err.status === 401 || err.status === 403) {
          showError('Нет доступа к этой заявке. Войдите в аккаунт или проверьте ссылку.');
        } else if (err.status === 404) {
          showError('Заявка не найдена');
        } else {
          showError('Не удалось загрузить заявку');
        }
      }
    }

    function showError(message) {
      const e = typeof escapeHtml === 'function' ? escapeHtml : (s) => String(s ?? '');
      document.getElementById('orderContent').innerHTML = `
        <div class="state-block">
          <div style="font-size:3.5rem; margin-bottom:16px; opacity:0.5;">⚠️</div>
          <h2 style="margin-bottom:12px;">${e(message)}</h2>
          <a href="/orders.html" class="btn-primary" style="display:inline-block; margin-top:20px; text-decoration:none;">К списку заявок</a>
        </div>
      `;
    }

    function renderOrder(order) {
      const e = typeof escapeHtml === 'function' ? escapeHtml : (s) => String(s ?? '');
      const statusClass = `status-${e(order.status)}`;
      const date = new Date(order.createdAt).toLocaleString('ru-RU', {
        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      const itemsHtml = (order.items || []).map(item => `
        <tr>
          <td>
            <div class="item-name">${e(item.productName || 'Товар')}</div>
            <div class="item-meta">ID: ${e(item.productId || '—')}</div>
          </td>
          <td style="text-align:center;">${e(item.quantity)}</td>
          <td style="text-align:right;">${e(I.formatMoney(item.unitPriceCents))}</td>
          <td style="text-align:right; font-weight:700;">${e(I.formatMoney(item.lineTotalCents))}</td>
        </tr>
      `).join('');

      const historyHtml = (order.statusHistory || []).map(h => `
        <div class="timeline-item">
          <div class="timeline-date">${e(new Date(h.createdAt).toLocaleString('ru-RU'))}</div>
          <div><strong>${e(getStatusText(h.toStatus))}</strong></div>
          ${h.reason ? `<div style="font-size:0.85rem; color:var(--text-muted);">${e(h.reason)}</div>` : ''}
        </div>
      `).join('') || '<div style="color:var(--text-muted)">История отсутствует</div>';

      document.getElementById('orderContent').innerHTML = `
        <div class="order-header">
          <div>
            <div class="order-number">${e(order.orderNumber)}</div>
            <div class="order-date">Создана: ${e(date)}</div>
          </div>
          <div class="status-badge ${statusClass}">
            ${e(getStatusText(order.status))}
          </div>
        </div>

        <div class="order-grid">
          <div>
            <!-- Товары -->
            <div class="card">
              <h2>Состав заявки</h2>
              <table class="items-table">
                <thead>
                  <tr>
                    <th>Товар</th>
                    <th style="text-align:center;">Кол-во</th>
                    <th style="text-align:right;">Цена</th>
                    <th style="text-align:right;">Сумма</th>
                  </tr>
                </thead>
                <tbody>
                  ${itemsHtml}
                </tbody>
              </table>
            </div>

            <!-- История статусов -->
            <div class="card">
              <h2>История статусов</h2>
              <div class="timeline">
                ${historyHtml}
              </div>
            </div>
          </div>

          <div>
            <!-- Сводка -->
            <div class="card">
              <h2>Сумма</h2>
              <div class="summary-row">
                <span>Подытог</span>
                <span>${e(I.formatMoney(order.subtotalCents || 0))}</span>
              </div>
              ${order.commissionCents ? `
              <div class="summary-row">
                <span>Комиссия</span>
                <span>${e(I.formatMoney(order.commissionCents))}</span>
              </div>` : ''}
              <div class="summary-row total">
                <span>Итого</span>
                <span>${e(I.formatMoney(order.totalCents || 0))}</span>
              </div>
            </div>

            <!-- Покупатель -->
            <div class="card">
              <h2>Покупатель</h2>
              <div class="info-grid">
                <div class="info-item">
                  <span>Имя</span>
                  <strong>${e(order.customerName || order.customer?.name || '—')}</strong>
                </div>
                <div class="info-item">
                  <span>Email</span>
                  <strong>${e(order.customerEmail || order.customer?.email || '—')}</strong>
                </div>
              </div>
            </div>

            <!-- Поставщик -->
            ${order.shop ? `
            <div class="card">
              <h2>Поставщик</h2>
              <div class="info-grid">
                <div class="info-item">
                  <span>Компания</span>
                  <strong>${e(order.shop.name)}</strong>
                </div>
              </div>
            </div>` : ''}
          </div>
        </div>
      `;
    }

    loadOrder();
  </script>
</body>
</html>
