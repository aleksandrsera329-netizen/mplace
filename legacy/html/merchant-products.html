<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace — Мои товары</title>

  <link rel="stylesheet" href="/assets/css/store-modern.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .page { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filters input, .filters select {
      padding: 9px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .filters input { min-width: 220px; }

    .bulk-bar {
      display: none;
      gap: 10px;
      margin-bottom: 12px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      align-items: center;
    }
    .bulk-bar.show { display: flex; }

    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: var(--bg-secondary); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:hover td { background: var(--card-hover); }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-ACTIVE { background: #10b98133; color: #10b981; }
    .badge-DRAFT { background: #f59e0b33; color: #f59e0b; }
    .badge-ARCHIVED { background: #ef444433; color: #ef4444; }

    .btn {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-sm {
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #000;
    }
    .btn-sm.outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-sm.danger { background: #ef4444; color: #fff; }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: min(520px, 95%);
      max-height: 90vh;
      overflow: auto;
      padding: 24px;
    }
    .modal h3 { margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .preview-img { max-width: 120px; max-height: 80px; margin-top: 8px; border-radius: 6px; }
  </style>
</head>
<body>

<header class="store-header">
  <div class="header-top">
    <a class="logo" href="/">M<span>place</span> Energy</a>
    <div class="header-actions">
      <button class="theme-btn" id="themeToggle">🌙</button>
      <div id="localeMount"></div>
      <a class="icon-btn" href="/merchant.html">🏪</a>
      <a class="icon-btn" href="/account.html">👤</a>
    </div>
  </div>
</header>

<div class="page">
  <div class="page-header">
    <h1 style="margin:0;font-size:1.5rem;">Мои товары</h1>
    <button class="btn" onclick="openModal()">+ Добавить товар</button>
  </div>

  <div class="filters">
    <input type="search" id="searchInput" placeholder="Название / SKU…">
    <select id="statusFilter">
      <option value="">Все статусы</option>
      <option value="ACTIVE">Active</option>
      <option value="DRAFT">Draft</option>
      <option value="ARCHIVED">Archived</option>
    </select>
    <button class="btn-sm" onclick="loadProducts(true)">Найти</button>
  </div>

  <div class="bulk-bar" id="bulkBar">
    <span id="selectedCount">0 выбрано</span>
    <button class="btn-sm" onclick="bulkStatus('ACTIVE')">Activate</button>
    <button class="btn-sm danger" onclick="bulkStatus('ARCHIVED')">Archive</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="checkAll" onchange="toggleAll()"></th>
          <th>Товар</th>
          <th>Цена</th>
          <th>Остаток</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="productsBody">
        <tr><td colspan="6" style="text-align:center;padding:40px;opacity:0.6;">Загрузка…</td></tr>
      </tbody>
    </table>
    <div class="pagination">
      <button class="btn-sm outline" id="prevBtn" disabled>← Назад</button>
      <span id="pageInfo"></span>
      <button class="btn-sm outline" id="nextBtn">Вперёд →</button>
    </div>
  </div>
</div>

<!-- Modal Create / Edit -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Новый товар</h3>
    <form id="productForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>Название *</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="description" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Цена (USD) *</label>
        <input type="number" id="price" step="0.01" min="0" required>
      </div>
      <div class="form-group">
        <label>Остаток</label>
        <input type="number" id="stock" value="10" min="0">
      </div>
      <div class="form-group">
        <label>SKU</label>
        <input type="text" id="sku">
      </div>
      <div class="form-group">
        <label>Статус</label>
        <select id="status">
          <option value="DRAFT">Draft</option>
          <option value="ACTIVE">Active</option>
          <option value="ARCHIVED">Archived</option>
        </select>
      </div>
      <div class="form-group">
        <label>Изображение</label>
        <input type="file" id="image" accept="image/*" onchange="previewImage(this)">
        <img id="imagePreview" class="preview-img" style="display:none;">
      </div>
      <div class="form-actions">
        <button type="button" class="btn-sm outline" onclick="closeModal()">Отмена</button>
        <button type="submit" class="btn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/api.js"></script>
<script>
  const I = window.MplaceI18n;
  let cursor = null;
  let selected = new Set();
  let editingId = null;
  let existingImageUrl = null;

  // Theme
  const themeToggle = document.getElementById('themeToggle');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('mplace_theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  themeToggle.onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  setTheme(localStorage.getItem('mplace_theme') || 'dark');
  if (I && I.mountSwitcher) I.mountSwitcher('#localeMount');

  function getToken() {
    return (window.MplaceApi && MplaceApi.getToken && MplaceApi.getToken())
      || sessionStorage.getItem('mplace_token')
      || localStorage.getItem('mplace_token')
      || '';
  }

  function apiBase() {
    return (window.MplaceApi && MplaceApi.getBase && MplaceApi.getBase()) || (location.origin + '/api');
  }

  function money(cents) {
    if (I && I.formatMoney) return I.formatMoney(cents || 0);
    return '$' + ((cents || 0) / 100).toFixed(2);
  }

  // Stage 21: full HTML escape (prefer global from api.js)
  function esc(s) {
    if (typeof escapeHtml === 'function') return escapeHtml(s);
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function api(path, opts = {}) {
    const token = getToken();
    const headers = {
      Authorization: 'Bearer ' + token,
      ...(opts.headers || {})
    };
    if (opts.body && !(opts.body instanceof FormData) && !headers['Content-Type']) {
      headers['Content-Type'] = 'application/json';
    }
    const res = await fetch(apiBase() + path, { ...opts, headers });
    if (res.status === 401) {
      location.href = '/login.html?email=merchant@demo.com&next=/merchant-products.html';
      throw new Error('Unauthorized');
    }
    if (!res.ok) {
      let err = await res.text();
      try {
        const j = JSON.parse(err);
        err = Array.isArray(j.message) ? j.message.join(', ') : (j.message || err);
      } catch (_) {}
      throw new Error(typeof err === 'string' ? err : JSON.stringify(err));
    }
    if (res.status === 204) return null;
    return res.json();
  }

  function toggleAll() {
    const checked = document.getElementById('checkAll').checked;
    document.querySelectorAll('#productsBody input[type=checkbox]').forEach(cb => {
      cb.checked = checked;
      if (checked) selected.add(cb.value);
      else selected.delete(cb.value);
    });
    updateBulk();
  }
  function toggleOne(id, cb) {
    if (cb.checked) selected.add(id);
    else selected.delete(id);
    updateBulk();
  }
  function updateBulk() {
    const bar = document.getElementById('bulkBar');
    document.getElementById('selectedCount').textContent = selected.size + ' выбрано';
    bar.classList.toggle('show', selected.size > 0);
  }

  async function loadProducts(reset = false) {
    if (reset) {
      cursor = null;
      selected.clear();
      document.getElementById('checkAll').checked = false;
    }
    const q = new URLSearchParams({ limit: '20' });
    if (cursor) q.set('cursor', cursor);
    const search = document.getElementById('searchInput').value;
    const status = document.getElementById('statusFilter').value;
    if (search) q.set('search', search);
    if (status) q.set('status', status);

    try {
      const data = await api('/products?' + q);
      const items = data.items || data || [];
      document.getElementById('productsBody').innerHTML = items.length
        ? items.map(p => `
            <tr>
              <td><input type="checkbox" value="${esc(p.id)}" onchange="toggleOne('${esc(p.id)}', this)"></td>
              <td>
                <div style="font-weight:600;">${esc(p.name)}</div>
                <div style="font-size:0.8rem;opacity:0.6;">${esc(p.sku || '')}</div>
              </td>
              <td>${money(p.priceCents)}</td>
              <td>
                <input type="number" value="${Number(p.stock) || 0}" min="0" style="width:70px;padding:4px 6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);"
                  onchange="quickStock('${esc(p.id)}', this.value)">
              </td>
              <td><span class="badge badge-${esc(p.status)}">${esc(p.status)}</span></td>
              <td>
                <button type="button" class="btn-sm outline" onclick="editProduct('${esc(p.id)}')">Изменить</button>
                ${p.status !== 'ARCHIVED'
                  ? `<button type="button" class="btn-sm danger" onclick="setStatus('${esc(p.id)}','ARCHIVED')">Archive</button>`
                  : `<button type="button" class="btn-sm" onclick="setStatus('${esc(p.id)}','ACTIVE')">Activate</button>`}
              </td>
            </tr>
          `).join('')
        : '<tr><td colspan="6" style="text-align:center;padding:40px;opacity:0.6;">Товаров нет</td></tr>';

      cursor = data.nextCursor || null;
      document.getElementById('nextBtn').disabled = !data.hasMore;
      document.getElementById('pageInfo').textContent = items.length + ' записей' + (data.hasMore ? ' · есть ещё' : '');
      updateBulk();
    } catch (e) {
      document.getElementById('productsBody').innerHTML =
        `<tr><td colspan="6" style="text-align:center;color:#ef4444;">Ошибка: ${esc(e.message)}</td></tr>`;
    }
  }

  document.getElementById('nextBtn').onclick = () => {
    if (document.getElementById('nextBtn').disabled) return;
    loadProducts(false);
  };
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); loadProducts(true); }
  });

  async function quickStock(id, stock) {
    try {
      await api('/products/' + id, {
        method: 'PATCH',
        body: JSON.stringify({ stock: Number(stock) })
      });
    } catch (e) {
      alert('Ошибка обновления остатка: ' + e.message);
      loadProducts(true);
    }
  }

  async function setStatus(id, status) {
    if (!confirm('Изменить статус на ' + status + '?')) return;
    try {
      await api('/products/' + id, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      loadProducts(true);
    } catch (e) {
      alert('Ошибка: ' + e.message);
    }
  }

  async function bulkStatus(status) {
    if (!selected.size || !confirm(`Изменить статус у ${selected.size} товаров?`)) return;
    try {
      for (const id of selected) {
        await api('/products/' + id, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });
      }
      loadProducts(true);
    } catch (e) {
      alert('Ошибка: ' + e.message);
      loadProducts(true);
    }
  }

  function openModal(product = null) {
    editingId = product?.id || null;
    existingImageUrl = product?.imageUrl || null;
    document.getElementById('modalTitle').textContent = product ? 'Редактировать товар' : 'Новый товар';
    document.getElementById('editId').value = product?.id || '';
    document.getElementById('name').value = product?.name || '';
    document.getElementById('description').value = product?.description || '';
    document.getElementById('price').value = product ? (product.priceCents / 100) : '';
    document.getElementById('stock').value = product?.stock ?? 10;
    document.getElementById('sku').value = product?.sku || '';
    document.getElementById('status').value = product?.status || 'DRAFT';
    document.getElementById('image').value = '';
    const img = document.getElementById('imagePreview');
    if (existingImageUrl) {
      img.src = existingImageUrl;
      img.style.display = 'block';
    } else {
      img.removeAttribute('src');
      img.style.display = 'none';
    }
    document.getElementById('modal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });

  function previewImage(input) {
    const img = document.getElementById('imagePreview');
    if (input.files?.[0]) {
      img.src = URL.createObjectURL(input.files[0]);
      img.style.display = 'block';
    }
  }

  async function editProduct(id) {
    try {
      const p = await api('/products/' + id);
      openModal(p);
    } catch (e) {
      alert('Не удалось загрузить товар: ' + e.message);
    }
  }

  async function saveProduct(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const price = parseFloat(String(document.getElementById('price').value).replace(',', '.'));
    if (!name || isNaN(price)) {
      alert('Название и цена обязательны');
      return;
    }

    let imageUrl = null;
    const file = document.getElementById('image').files[0];
    if (file) {
      try {
        const formData = new FormData();
        formData.append('file', file);
        const up = await fetch(apiBase() + '/products/upload-image', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + getToken() },
          body: formData
        });
        if (!up.ok) throw new Error(await up.text());
        const data = await up.json();
        imageUrl = data.url || data.publicUrl || data.imageUrl;
      } catch (err) {
        alert('Ошибка загрузки изображения: ' + err.message);
        return;
      }
    }

    const payload = {
      name,
      description: document.getElementById('description').value.trim() || undefined,
      priceCents: Math.round(price * 100),
      stock: Number(document.getElementById('stock').value) || 0,
      sku: document.getElementById('sku').value.trim() || undefined,
      status: document.getElementById('status').value,
    };
    if (imageUrl) payload.imageUrl = imageUrl;

    try {
      if (editingId) {
        await api('/products/' + editingId, { method: 'PATCH', body: JSON.stringify(payload) });
      } else {
        await api('/products', { method: 'POST', body: JSON.stringify(payload) });
      }
      closeModal();
      // clear ?action=new from URL
      if (location.search.includes('action=new')) {
        history.replaceState({}, '', '/merchant-products.html');
      }
      loadProducts(true);
    } catch (err) {
      alert('Ошибка сохранения: ' + err.message);
    }
  }

  async function init() {
    if (!getToken()) {
      location.href = '/login.html?email=merchant@demo.com&next=/merchant-products.html';
      return;
    }
    await loadProducts(true);
    const params = new URLSearchParams(location.search);
    if (params.get('action') === 'new') openModal();
  }
  init();
</script>
</body>
</html>
