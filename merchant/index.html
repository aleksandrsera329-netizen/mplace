<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace Energy — Supplier</title>
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <link rel="stylesheet" href="../assets/css/locale.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">M<span>place</span> Energy</div>
      <div class="user-panel">
        <div class="user-avatar" id="userAvatar">M</div>
        <div class="info">
          <span id="userName">Merchant</span>
          <small id="shopName">Big Shop</small>
        </div>
      </div>
      <ul class="sidebar-menu" id="sidebarMenu"></ul>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="toggle-btn" id="toggleSidebar">☰</button>
          <a href="../index.html" target="_blank" data-i18n="nav.storefront">Store front</a>
          <div id="localeMount"></div>
        </div>
        <div class="topbar-right">
          <a href="#messages"><span data-i18n="admin.messages">Messages</span> <span class="badge">2</span></a>
          <a href="#account" data-i18n="admin.account">Account</a>
          <a href="#" id="logoutBtn" data-i18n="admin.logout">Logout</a>
        </div>
      </header>
      <main class="content" id="content"></main>
      <footer class="main-footer">
        <span><strong>Mplace Energy</strong> <span data-i18n="merchant.panel">Supplier Panel</span></span>
        <span id="footerShop">Demo</span>
      </footer>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/merchant.js"></script>
</body>
</html>
