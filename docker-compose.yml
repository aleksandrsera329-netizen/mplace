services:
  postgres:
    image: postgres:16-alpine
    container_name: mplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mplace
      POSTGRES_PASSWORD: mplace
      POSTGRES_DB: mplace
    ports:
      - "5432:5432"
    volumes:
      - mplace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplace -d mplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mplace_pg_data:
