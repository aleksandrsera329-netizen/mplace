services:
  postgres:
    image: postgres:16-alpine
    container_name: mplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mplace}
      POSTGRES_DB: ${POSTGRES_DB:-mplace}
    ports:
      # 5433 avoids conflict with local Windows PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - mplace_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mplace} -d ${POSTGRES_DB:-mplace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mplace_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mplace-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mplace}:${POSTGRES_PASSWORD:-mplace}@postgres:5432/${POSTGRES_DB:-mplace}?schema=public
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-masterKeyChangeMe_at_least_16_chars}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyChangeMe_at_least_16_chars}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
    # Host 3001 if 3000 is taken (e.g. other Docker apps). Container still listens on 3000.
    ports:
      - "3001:3000"
    volumes:
      # Local media files (URL /uploads/... via nginx)
      - ./uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mplace-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyChangeMe_at_least_16_chars}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - mplace_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: mplace-nginx
    restart: unless-stopped
    # Host 8088 if 80 is taken by Caddy/other stacks. Inside container: 80.
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    depends_on:
      - api

volumes:
  mplace_pg_data:
  mplace_redis_data:
  mplace_meili_data:
