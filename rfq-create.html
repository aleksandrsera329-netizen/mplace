!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Создать RFQ — Mplace Energy</title>
  <base href="/" />

  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .rfq-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .rfq-header {
      margin-bottom: 36px;
    }

    .rfq-header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 7px;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 13px 15px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-size: 1rem;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .item-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      position: relative;
    }

    .item-row .remove-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .item-row .remove-btn:hover {
      color: var(--danger);
    }

    .item-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .item-grid {
        grid-template-columns: 1fr;
      }
    }

    .btn-add-item {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      padding: 14px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-add-item:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .btn-submit {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 16px 32px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.25s;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.45);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .state-block {
      text-align: center;
      padding: 80px 20px;
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle">🌙</button>
        <div id="localeMount"></div>
        <a href="/account.html" class="icon-btn">👤</a>
      </div>
    </div>
  </header>

  <div class="rfq-page">
    <div id="rfqContent">
      <div class="rfq-header">
        <h1>Создать запрос предложений (RFQ)</h1>
        <p style="color: var(--text-muted);">Опишите, что вам нужно — поставщики пришлют свои предложения</p>
      </div>

      <div class="card">
        <h2>Основная информация</h2>

        <div class="form-group">
          <label>Название заявки *</label>
          <input type="text" id="title" placeholder="Например: Поставка задвижек и фланцев для проекта">
        </div>

        <div class="form-group">
          <label>Описание</label>
          <textarea id="description" placeholder="Дополнительные требования, условия поставки, стандарты..."></textarea>
        </div>

        <div class="form-group">
          <label>Срок приёма предложений (необязательно)</label>
          <input type="date" id="deadline">
        </div>
      </div>

      <div class="card">
        <h2>Позиции заявки *</h2>

        <div class="items-list" id="itemsList">
          <!-- сюда добавляются позиции -->
        </div>

        <button class="btn-add-item" onclick="addItem()">+ Добавить позицию</button>
      </div>

      <button class="btn-submit" id="submitBtn" onclick="submitRfq()">
        Отправить запрос поставщикам
      </button>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>

  <script>
    const I = window.MplaceI18n;
    let itemCounter = 0;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    I.mountSwitcher('#localeMount');

    // Проверка авторизации
    function checkAuth() {
      const token = MplaceApi.getToken?.() || sessionStorage.getItem('mplace_token');
      const user = MplaceApi.getUser?.() || JSON.parse(sessionStorage.getItem('mplace_user') || 'null');

      if (!token || !user) {
        document.getElementById('rfqContent').innerHTML = `
          <div class="state-block">
            <div style="font-size:3.5rem; margin-bottom:16px; opacity:0.5;">🔒</div>
            <h2>Требуется вход</h2>
            <p style="color:var(--text-muted); margin:12px 0 28px;">Чтобы создать RFQ, необходимо войти в аккаунт</p>
            <a href="/login.html" class="btn-submit" style="display:inline-block; text-decoration:none; width:auto; padding:14px 32px;">Войти</a>
          </div>
        `;
        return false;
      }
      return true;
    }

    function addItem(data = {}) {
      itemCounter++;
      const id = itemCounter;

      const div = document.createElement('div');
      div.className = 'item-row';
      div.id = `item-${id}`;
      div.innerHTML = `
        <button class="remove-btn" onclick="removeItem(${id})" title="Удалить">×</button>
        <div class="item-grid">
          <div class="form-group" style="margin:0;">
            <label>Название позиции *</label>
            <input type="text" class="item-name" value="${data.name || ''}" placeholder="Gate Valve 6&quot; Class 600">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Количество *</label>
            <input type="number" class="item-qty" value="${data.quantity || 1}" min="1">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Ед. изм.</label>
            <input type="text" class="item-unit" value="${data.unit || 'шт'}" placeholder="шт">
          </div>
        </div>
        <div class="form-group" style="margin-top:12px; margin-bottom:0;">
          <label>Спецификация / требования</label>
          <input type="text" class="item-specs" value="${data.specs || ''}" placeholder="API 6A, материал и т.д.">
        </div>
      `;
      document.getElementById('itemsList').appendChild(div);
    }

    function removeItem(id) {
      const el = document.getElementById(`item-${id}`);
      if (el) el.remove();
    }

    async function submitRfq() {
      if (!checkAuth()) return;

      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const deadlineInput = document.getElementById('deadline').value;

      if (!title || title.length < 3) {
        alert('Укажите название заявки (минимум 3 символа)');
        return;
      }

      const itemRows = document.querySelectorAll('.item-row');
      if (itemRows.length === 0) {
        alert('Добавьте хотя бы одну позицию');
        return;
      }

      const items = [];
      let hasError = false;

      itemRows.forEach(row => {
        const name = row.querySelector('.item-name').value.trim();
        const quantity = parseInt(row.querySelector('.item-qty').value);
        const unit = row.querySelector('.item-unit').value.trim();
        const specs = row.querySelector('.item-specs').value.trim();

        if (!name || !quantity || quantity < 1) {
          hasError = true;
        } else {
          items.push({ name, quantity, unit: unit || 'шт', specs: specs || undefined });
        }
      });

      if (hasError) {
        alert('Проверьте все позиции: название и количество обязательны');
        return;
      }

      const payload = {
        title,
        description: description || undefined,
        items
      };

      if (deadlineInput) {
        payload.deadline = new Date(deadlineInput).toISOString();
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Отправляем...';

      try {
        const rfq = await MplaceApi.createRfq(payload);
        
        document.getElementById('rfqContent').innerHTML = `
          <div class="state-block">
            <div style="font-size:4rem; margin-bottom:20px;">✅</div>
            <h2>RFQ успешно создан!</h2>
            <p style="color:var(--text-muted); margin:12px 0 8px;">Номер заявки:</p>
            <div style="font-size:1.4rem; font-weight:700; color:var(--primary); margin-bottom:28px;">
              ${rfq.number || rfq.id || '—'}
            </div>
            <p style="color:var(--text-muted); margin-bottom:32px;">
              Поставщики получили уведомление и скоро пришлют предложения.
            </p>
            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
              <a href="/rfq.html?id=${rfq.id}" class="btn-submit" style="display:inline-block; text-decoration:none; width:auto; padding:14px 28px;">
                Открыть заявку
              </a>
              <a href="/account.html" class="btn-add-item" style="display:inline-block; text-decoration:none; width:auto; padding:14px 28px;">
                В кабинет
              </a>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Отправить запрос поставщикам';
        alert('Ошибка при создании RFQ. Проверьте данные и права доступа.');
      }
    }

    // Инициализация
    if (checkAuth()) {
      addItem(); // добавляем первую позицию по умолчанию
    }
  </script>
</body>
</html>
