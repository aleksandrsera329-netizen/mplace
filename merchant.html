<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace — Кабинет поставщика</title>

  <link rel="stylesheet" href="/assets/css/store-modern.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .merchant-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .stat-card .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-card .value {
      font-size: 1.7rem;
      font-weight: 700;
      margin-top: 8px;
      color: var(--accent);
    }
    .stat-card .sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card h3 a {
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .list-item:last-child { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-ACTIVE, .badge-PAID, .badge-COMPLETED { background: #10b98133; color: #10b981; }
    .badge-PENDING, .badge-NEW { background: #f59e0b33; color: #f59e0b; }
    .badge-SUSPENDED, .badge-CANCELLED { background: #ef444433; color: #ef4444; }
    .badge-SHIPPED { background: #3b82f633; color: #3b82f6; }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .quick-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      transition: all 0.2s;
    }
    .quick-btn:hover {
      border-color: var(--primary);
      background: var(--card-hover);
      transform: translateY(-2px);
    }
    .quick-btn span {
      display: block;
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    .stripe-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
    }
    [data-theme="light"] .stripe-box {
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    }
    .stripe-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn.outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn.danger { background: #ef4444; color: #fff; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle">🌙</button>
        <div id="localeMount"></div>
        <a class="icon-btn" href="/account.html">👤</a>
      </div>
    </div>
  </header>

  <div class="merchant-layout">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:1.6rem;margin:0;">Кабинет поставщика</h1>
        <div id="shopName" style="color:var(--text-muted);margin-top:4px;">Загрузка…</div>
      </div>
      <div id="shopStatusBadge"></div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <a class="quick-btn" href="/merchant-products.html">
        <span>📦</span>
        Мои товары
      </a>
      <a class="quick-btn" href="/merchant-products.html?action=new">
        <span>➕</span>
        Добавить товар
      </a>
      <a class="quick-btn" href="/merchant-orders.html">
        <span>📋</span>
        Заказы магазина
      </a>
      <a class="quick-btn" href="/rfqs.html?role=merchant">
        <span>📨</span>
        RFQ / Заявки
      </a>
    </div>

    <!-- Stripe Connect -->
    <div class="stripe-box" id="stripeBox">
      <div class="stripe-status">
        <div>
          <div style="font-weight:600;margin-bottom:4px;">Stripe Connect</div>
          <div id="stripeStatusText" style="color:var(--text-muted);font-size:0.9rem;">Проверяем статус…</div>
        </div>
        <div id="stripeActions"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Загрузка…</div></div>
    </div>

    <!-- Two columns -->
    <div class="grid-2">
      <!-- Recent Orders -->
      <div class="card">
        <h3>
          Последние заказы
          <a href="/merchant-orders.html">Все →</a>
        </h3>
        <div id="recentOrders">Загрузка…</div>
      </div>

      <!-- Recent Products -->
      <div class="card">
        <h3>
          Мои товары
          <a href="/merchant-products.html">Все →</a>
        </h3>
        <div id="recentProducts">Загрузка…</div>
      </div>
    </div>

    <!-- Balance & Payout -->
    <div class="card" style="margin-bottom:28px;">
      <h3>Баланс и выплаты</h3>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
        <div>
          <div style="font-size:0.85rem;color:var(--text-muted);">Доступно к выводу</div>
          <div id="availableBalance" style="font-size:1.8rem;font-weight:700;color:var(--accent);">—</div>
        </div>
        <button class="btn" id="requestPayoutBtn" onclick="requestPayout()">Запросить выплату</button>
      </div>
      <div id="payoutHistory" style="margin-top:20px;font-size:0.9rem;color:var(--text-muted);">
        История выплат появится здесь
      </div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('mplace_theme', t);
      themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    if (I && I.mountSwitcher) I.mountSwitcher('#localeMount');

    function getToken() {
      return (window.MplaceApi && MplaceApi.getToken && MplaceApi.getToken())
        || sessionStorage.getItem('mplace_token')
        || localStorage.getItem('mplace_token')
        || '';
    }

    function money(cents) {
      if (I && I.formatMoney) return I.formatMoney(cents || 0);
      return '$' + ((cents || 0) / 100).toFixed(2);
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/"/g, '&quot;');
    }

    async function api(path, opts = {}) {
      const token = getToken();
      const base = (window.MplaceApi && MplaceApi.getBase && MplaceApi.getBase()) || (location.origin + '/api');
      const res = await fetch(base + path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
          ...(opts.headers || {})
        }
      });
      if (res.status === 401) {
        location.href = '/login.html?email=merchant@demo.com&next=/merchant.html';
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        let err = await res.text();
        try {
          const j = JSON.parse(err);
          err = j.message || (Array.isArray(j.message) ? j.message.join(', ') : err);
        } catch (_) {}
        throw new Error(typeof err === 'string' ? err : JSON.stringify(err));
      }
      if (res.status === 204) return null;
      return res.json();
    }

    async function loadDashboard() {
      try {
        const [me, products, orders, connectStatus, balance, payouts] = await Promise.all([
          api('/auth/me').catch(() => null),
          api('/products?limit=5').catch(() => ({ items: [] })),
          api('/orders?limit=5').catch(() => ({ items: [] })),
          api('/connect/status').catch(() => null),
          api('/merchant/balance').catch(() => null),
          api('/payouts').catch(() => []),
        ]);

        if (me && me.role && !['MERCHANT', 'ADMIN', 'SUPER_ADMIN'].includes(String(me.role).toUpperCase())) {
          document.getElementById('shopName').textContent = 'Нужна роль MERCHANT';
        }

        const shop = me?.shop || me?.user?.shop;
        if (shop) {
          document.getElementById('shopName').textContent = shop.name || 'Мой магазин';
          const status = shop.status || 'PENDING';
          document.getElementById('shopStatusBadge').innerHTML =
            `<span class="badge badge-${esc(status)}">${esc(status)}</span>`;
        } else if (me) {
          document.getElementById('shopName').textContent = me.name || me.email || 'Магазин не привязан';
        }

        const prods = products.items || (Array.isArray(products) ? products : []);
        const orderItems = orders.items || (Array.isArray(orders) ? orders : []);
        const productCount = prods.length;
        const totalOrders = orderItems.length;
        const paidOrders = orderItems.filter(o => ['PAID', 'SHIPPED', 'COMPLETED', 'FULFILLED'].includes(o.status));
        const gmv = paidOrders.reduce((s, o) => s + (o.totalCents || 0), 0);

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card">
            <div class="label">Товары</div>
            <div class="value">${productCount}</div>
            <div class="sub">в каталоге (стр.)</div>
          </div>
          <div class="stat-card">
            <div class="label">Заказы</div>
            <div class="value">${totalOrders}</div>
            <div class="sub">последние</div>
          </div>
          <div class="stat-card">
            <div class="label">Оборот</div>
            <div class="value">${money(gmv)}</div>
            <div class="sub">оплаченные</div>
          </div>
          <div class="stat-card">
            <div class="label">Активные</div>
            <div class="value">${paidOrders.length}</div>
            <div class="sub">в работе</div>
          </div>
        `;

        const ordersHtml = orderItems.length
          ? orderItems.map(o => `
              <div class="list-item">
                <div>
                  <a href="/order.html?id=${esc(o.id)}" style="color:var(--primary);font-weight:600;">
                    ${esc(o.orderNumber || String(o.id).slice(0, 8))}
                  </a>
                  <div style="font-size:0.8rem;opacity:0.7;">${new Date(o.createdAt).toLocaleDateString()}</div>
                </div>
                <div style="text-align:right;">
                  <div>${money(o.totalCents)}</div>
                  <span class="badge badge-${esc(o.status)}">${esc(o.status)}</span>
                </div>
              </div>
            `).join('')
          : '<div style="opacity:0.6;padding:20px 0;text-align:center;">Заказов пока нет</div>';
        document.getElementById('recentOrders').innerHTML = ordersHtml;

        const productsHtml = prods.length
          ? prods.map(p => `
              <div class="list-item">
                <div>
                  <div style="font-weight:600;">${esc(p.name)}</div>
                  <div style="font-size:0.8rem;opacity:0.7;">Остаток: ${p.stock ?? p.stockQty ?? '—'}</div>
                </div>
                <div style="font-weight:600;color:var(--accent);">${money(p.priceCents)}</div>
              </div>
            `).join('')
          : '<div style="opacity:0.6;padding:20px 0;text-align:center;">Товаров пока нет</div>';
        document.getElementById('recentProducts').innerHTML = productsHtml;

        renderStripe(connectStatus);

        const available = balance?.availableCents != null
          ? balance.availableCents
          : Math.round(gmv * 0.9);
        document.getElementById('availableBalance').textContent = money(available);
        if (balance) {
          document.getElementById('availableBalance').title =
            `earned ${money(balance.earnedCents)} · paid ${money(balance.paidOutCents)} · pending ${money(balance.pendingPayoutCents)}`;
        }

        const payoutList = Array.isArray(payouts) ? payouts : (payouts.items || []);
        if (payoutList.length) {
          document.getElementById('payoutHistory').innerHTML = payoutList.slice(0, 8).map(p => `
            <div class="list-item">
              <div>
                <span class="badge badge-${esc(p.status)}">${esc(p.status)}</span>
                <span style="margin-left:8px;opacity:0.7;">${new Date(p.createdAt).toLocaleDateString()}</span>
              </div>
              <div style="font-weight:600;">${money(p.amountCents)}</div>
            </div>
          `).join('');
        } else {
          document.getElementById('payoutHistory').textContent = 'История выплат пуста';
        }
      } catch (e) {
        console.error(e);
        document.getElementById('shopName').textContent = 'Ошибка загрузки';
      }
    }

    function renderStripe(status) {
      const textEl = document.getElementById('stripeStatusText');
      const actionsEl = document.getElementById('stripeActions');

      if (!status || status.connected === false || !status.stripeAccountId) {
        textEl.textContent = 'Stripe ещё не подключён';
        actionsEl.innerHTML = `<button type="button" class="btn" onclick="startOnboarding()">Подключить Stripe</button>`;
        return;
      }

      if (status.chargesEnabled && status.payoutsEnabled) {
        textEl.innerHTML = `<span class="badge badge-ACTIVE">Активен</span> — можно принимать платежи`;
        actionsEl.innerHTML = `<button type="button" class="btn outline" onclick="startOnboarding()">Обновить данные</button>`;
      } else if (status.detailsSubmitted) {
        textEl.textContent = 'Данные отправлены, ожидаем проверку Stripe…';
        actionsEl.innerHTML = `<button type="button" class="btn outline" onclick="checkStripeStatus()">Проверить статус</button>`;
      } else {
        textEl.textContent = 'Нужно пройти онбординг';
        actionsEl.innerHTML = `<button type="button" class="btn" onclick="startOnboarding()">Продолжить онбординг</button>`;
      }
    }

    async function startOnboarding() {
      try {
        const res = await api('/connect/onboard', { method: 'POST' });
        if (res.url) {
          window.location.href = res.url;
        } else {
          alert('Не удалось получить ссылку онбординга');
        }
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }
    }

    async function checkStripeStatus() {
      try {
        const status = await api('/connect/status');
        renderStripe(status);
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }
    }

    async function requestPayout() {
      const amount = prompt('Сумма к выводу (в основных единицах валюты, например 10.50):');
      if (!amount) return;

      const amountCents = Math.round(parseFloat(String(amount).replace(',', '.')) * 100);
      if (isNaN(amountCents) || amountCents <= 0) {
        alert('Некорректная сумма');
        return;
      }

      try {
        await api('/payouts', {
          method: 'POST',
          body: JSON.stringify({
            amountCents,
            note: 'Запрос из кабинета поставщика'
          })
        });
        alert('Заявка на выплату создана. Ожидайте одобрения администратора.');
        loadDashboard();
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }
    }

    async function init() {
      if (!getToken()) {
        location.href = '/login.html?email=merchant@demo.com&next=/merchant.html';
        return;
      }
      if (new URLSearchParams(location.search).get('stripe') === 'return') {
        try { await api('/connect/status'); } catch (_) {}
      }
      await loadDashboard();
    }

    init();
  </script>
</body>
</html>
