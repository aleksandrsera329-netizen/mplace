<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кабинет поставщика — Mplace Energy</title>
  <base href="/" />

  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .merchant-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .merchant-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .merchant-header h1 {
      font-size: 2rem;
      font-weight: 800;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .stat-value {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px;
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card h2 a {
      font-size: 0.9rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
    }
    .list-item:last-child {
      border-bottom: none;
    }
    .list-item:hover {
      color: var(--primary);
    }

    .list-item .meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    .action-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .state-block {
      text-align: center;
      padding: 80px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    @media (max-width: 800px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle">🌙</button>
        <div id="localeMount"></div>
        <a class="icon-btn" href="/account.html">👤</a>
      </div>
    </div>
  </header>

  <div class="merchant-page">
    <div id="merchantContent">
      <div style="text-align:center; padding:80px 0; opacity:0.6;">Загрузка кабинета поставщика...</div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>

  <script>
    const I = window.MplaceI18n;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    I.mountSwitcher('#localeMount');

    function getStatusText(status) {
      const map = {
        PENDING_PAYMENT: 'Ожидает оплаты',
        PAID: 'Оплачена',
        PROCESSING: 'В обработке',
        SHIPPED: 'Отправлена',
        COMPLETED: 'Завершена',
        CANCELLED: 'Отменена'
      };
      return map[status] || status;
    }

    async function init() {
      const token = MplaceApi.getToken?.() || sessionStorage.getItem('mplace_token');
      const user = MplaceApi.getUser?.() || JSON.parse(sessionStorage.getItem('mplace_user') || 'null');

      if (!token || !user) {
        showAccessDenied('Требуется вход в аккаунт');
        return;
      }

      // Проверяем роль
      const role = (user.role || '').toUpperCase();
      if (!['MERCHANT', 'ADMIN', 'SUPER_ADMIN'].includes(role) && !user.shopId) {
        showAccessDenied('Этот раздел доступен только поставщикам');
        return;
      }

      await renderDashboard(user);
    }

    function showAccessDenied(message) {
      document.getElementById('merchantContent').innerHTML = `
        <div class="state-block">
          <div style="font-size:4rem; margin-bottom:20px; opacity:0.5;">🚫</div>
          <h2 style="margin-bottom:12px;">${message}</h2>
          <a href="/account.html" class="btn-primary" style="display:inline-block; margin-top:20px; text-decoration:none; padding:14px 28px;">В личный кабинет</a>
        </div>
      `;
    }

    async function renderDashboard(user) {
      let products = [];
      let orders = [];
      let balance = null;

      try {
        const [prodRes, ordRes, balRes] = await Promise.all([
          MplaceApi.products().catch(() => []),
          MplaceApi.orders().catch(() => []),
          MplaceApi.balance ? MplaceApi.balance().catch(() => null) : null
        ]);

        products = Array.isArray(prodRes) ? prodRes : (prodRes.items || []);
        orders = Array.isArray(ordRes) ? ordRes : (ordRes.items || []);
        balance = balRes;
      } catch (e) {
        console.error(e);
      }

      const totalRevenue = orders.reduce((sum, o) => sum + (o.totalCents || o.subtotalCents || 0), 0);
      const activeOrders = orders.filter(o => ['PENDING_PAYMENT', 'PAID', 'PROCESSING'].includes(o.status)).length;
      const recentOrders = orders.slice(0, 5);
      const recentProducts = products.slice(0, 5);

      document.getElementById('merchantContent').innerHTML = `
        <div class="merchant-header">
          <div>
            <h1>Кабинет поставщика</h1>
            <div style="color:var(--text-muted); margin-top:6px;">
              ${user.name || user.email} ${user.shopId ? '· Магазин активен' : ''}
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${products.length}</div>
            <div class="stat-label">Товаров</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${orders.length}</div>
            <div class="stat-label">Всего заявок</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${activeOrders}</div>
            <div class="stat-label">Активных заявок</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${I.formatMoney(totalRevenue)}</div>
            <div class="stat-label">Оборот</div>
          </div>
        </div>

        <div class="content-grid">
          <!-- Последние заявки -->
          <div class="card">
            <h2>
              Последние заявки
              <a href="/orders.html">Все →</a>
            </h2>

            ${recentOrders.length === 0 ? `
              <div style="text-align:center; padding:30px 0; color:var(--text-muted);">Заявок пока нет</div>
            ` : recentOrders.map(order => `
              <a href="/order.html?id=${order.id}" class="list-item">
                <div>
                  <div style="font-weight:600;">${order.orderNumber || order.id}</div>
                  <div class="meta">${new Date(order.createdAt).toLocaleDateString('ru-RU')} · ${getStatusText(order.status)}</div>
                </div>
                <div style="font-weight:700;">${I.formatMoney(order.totalCents || 0)}</div>
              </a>
            `).join('')}
          </div>

          <!-- Товары + действия -->
          <div class="card">
            <h2>
              Мои товары
              <a href="/merchant-products.html">Управление →</a>
            </h2>

            ${recentProducts.length === 0 ? `
              <div style="text-align:center; padding:30px 0; color:var(--text-muted);">Товаров пока нет</div>
            ` : recentProducts.map(p => `
              <div class="list-item">
                <div>
                  <div style="font-weight:600;">${p.name}</div>
                  <div class="meta">Остаток: ${p.stock} · ${I.formatMoney(p.priceCents)}</div>
                </div>
              </div>
            `).join('')}

            <div class="quick-actions">
              <a href="/merchant-products.html" class="action-btn">+ Добавить товар</a>
              <a href="/rfqs.html" class="action-btn">RFQ</a>`n              <a href="/orders.html" class="action-btn">Все заявки</a>
            </div>
          </div>
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
