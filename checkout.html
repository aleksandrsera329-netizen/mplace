<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оформление заявки — Mplace Energy</title>
  <base href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />
  <style>
    .checkout-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 28px 80px;
      position: relative;
      z-index: 1;
    }
    .checkout-header { margin-bottom: 40px; }
    .checkout-header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 40px;
      align-items: start;
    }
    .checkout-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
    }
    .form-group { margin-bottom: 24px; }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      transition: all 0.2s;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }
    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }
    .checkout-summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      position: sticky;
      top: 100px;
    }
    .checkout-summary h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .summary-items {
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding-right: 8px;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .summary-item:last-child { border-bottom: none; }
    .summary-total {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      margin: 24px 0;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(245, 158, 11, 0.45);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .success-screen {
      text-align: center;
      padding: 80px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 640px;
      margin: 0 auto;
    }
    .success-icon {
      font-size: 5rem;
      margin-bottom: 24px;
    }
    .success-screen h1 {
      font-size: 2rem;
      margin-bottom: 16px;
    }
    .success-screen .order-number {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin: 24px 0;
      padding: 16px;
      background: var(--primary-soft);
      border-radius: 12px;
      display: inline-block;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
    }
    .back-link:hover { color: var(--primary); }
    .form-error {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
    }
    .form-error.show { display: block; }
    @media (max-width: 900px) {
      .checkout-layout { grid-template-columns: 1fr; }
      .checkout-summary { position: static; }
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button type="button" class="theme-btn" id="themeToggle" title="Тема">🌙</button>
        <div id="localeMount"></div>
        <a class="icon-btn" href="/login.html" title="Аккаунт">👤</a>
        <a class="cart-btn" href="/cart.html" style="text-decoration:none">
          🛒 <span data-i18n="nav.cart">Корзина</span>
        </a>
      </div>
    </div>
  </header>

  <div class="checkout-page">
    <div id="checkoutContent">
      <div style="text-align:center; padding:100px 0; opacity:0.6;" data-i18n="common.loading">Загрузка...</div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;
    let currentCart = null;

    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    I.mountSwitcher('#localeMount');

    function unitPrice(item) {
      return item.product?.priceCents ?? item.priceCents ?? 0;
    }

    async function init() {
      try {
        currentCart = await MplaceApi.cart();

        if (!currentCart.items || currentCart.items.length === 0) {
          document.getElementById('checkoutContent').innerHTML = `
            <div class="success-screen">
              <div class="success-icon">🛒</div>
              <h1>Заявка пуста</h1>
              <p style="color:var(--text-muted); margin-bottom:32px;">Добавьте товары из каталога</p>
              <a href="/" class="btn-submit" style="display:inline-block; text-decoration:none; width:auto; padding:16px 40px;">Перейти в каталог</a>
            </div>
          `;
          return;
        }

        renderForm();
      } catch (err) {
        console.error(err);
        document.getElementById('checkoutContent').innerHTML =
          `<p style="text-align:center;color:var(--danger)">Ошибка загрузки корзины: ${err.message || ''}</p>`;
      }
    }

    function renderForm() {
      const user = MplaceApi.getUser() || {};
      const itemsHtml = currentCart.items.map((item) => {
        const p = item.product || {};
        const line = unitPrice(item) * item.quantity;
        return `
          <div class="summary-item">
            <div>
              <div style="font-weight:600">${p.name || 'Товар'}</div>
              <div style="font-size:0.85rem; color:var(--text-muted)">${item.quantity} шт. · ${p.shop?.name || ''}</div>
            </div>
            <div style="font-weight:700">${I.formatMoney(line)}</div>
          </div>
        `;
      }).join('');

      document.getElementById('checkoutContent').innerHTML = `
        <div class="checkout-header">
          <a class="back-link" href="/cart.html">← Назад к заявке</a>
          <h1>Оформление заявки</h1>
        </div>

        <div class="checkout-layout">
          <div class="checkout-form">
            <div class="form-group">
              <label>Ваше имя *</label>
              <input type="text" id="customerName" placeholder="Иван Иванов" required
                value="${String(user.name || '').replace(/"/g, '&quot;')}">
            </div>

            <div class="form-group">
              <label>Email *</label>
              <input type="email" id="customerEmail" placeholder="buyer@company.com" required
                value="${String(user.email || '').replace(/"/g, '&quot;')}">
            </div>

            <div class="form-group">
              <label>Комментарий к заявке</label>
              <textarea id="comment" placeholder="Сроки поставки, особые требования, адрес доставки..."></textarea>
            </div>

            <button type="button" class="btn-submit" id="submitBtn">Отправить заявку</button>
            <div class="form-error" id="formError"></div>
          </div>

          <div class="checkout-summary">
            <h2>Ваша заявка</h2>
            <div class="summary-items">
              ${itemsHtml}
            </div>
            <div class="summary-total">
              <span>Итого</span>
              <span>${I.formatMoney(currentCart.subtotalCents || 0)}</span>
            </div>
            <a href="/cart.html" style="color:var(--text-muted);font-size:0.9rem">Изменить состав →</a>
          </div>
        </div>
      `;

      document.getElementById('submitBtn').onclick = submitCheckout;
    }

    async function submitCheckout() {
      const name = document.getElementById('customerName').value.trim();
      const email = document.getElementById('customerEmail').value.trim();
      const comment = document.getElementById('comment').value.trim();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('formError');
      errEl.classList.remove('show');

      if (!name || !email) {
        errEl.textContent = 'Пожалуйста, заполните имя и email';
        errEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Отправляем...';

      try {
        const body = {
          customerName: name,
          customerEmail: email,
        };
        if (comment) body.comment = comment;

        const result = await MplaceApi.checkout(body);
        const orders = result?.orders || [];
        const numbers = orders.map((o) => o.orderNumber).filter(Boolean);
        const orderNumber = numbers.length
          ? numbers.join(', ')
          : (result?.orderNumber || result?.id || '—');

        // Optional: create payment intents in background (dev mode)
        for (const order of orders) {
          try {
            await MplaceApi.paymentIntent(
              order.id,
              order.paymentToken,
              'checkout_' + order.id + '_' + Date.now(),
            );
          } catch (_) { /* ignore payment intent errors on demo */ }
        }

        document.getElementById('checkoutContent').innerHTML = `
          <div class="success-screen">
            <div class="success-icon">✅</div>
            <h1>Заявка успешно создана!</h1>
            <p style="color:var(--text-muted)">Мы получили вашу заявку и скоро свяжемся с вами.</p>
            <div class="order-number">Номер заявки: ${orderNumber}</div>
            ${orders.length > 1
              ? `<p style="color:var(--text-muted);font-size:0.9rem">Создано заказов: ${orders.length} (по поставщикам)</p>`
              : ''}
            <div style="margin-top:32px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
              <a href="/" class="btn-submit" style="display:inline-block; text-decoration:none; width:auto; padding:16px 32px;">Вернуться в каталог</a>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Отправить заявку';
        errEl.textContent = err.message || 'Ошибка при создании заявки. Попробуйте ещё раз.';
        errEl.classList.add('show');
      }
    }

    init();
  </script>
</body>
</html>
