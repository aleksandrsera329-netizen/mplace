<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace Energy — Oil & Gas B2B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/store.css" />
  <link rel="stylesheet" href="assets/css/locale.css" />
  <style>
    .cart-drawer {
      position: fixed; top: 0; right: 0; width: min(400px, 100%); height: 100%;
      background: var(--card); box-shadow: -8px 0 30px rgba(0,0,0,.5); z-index: 100;
      transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column;
      border-left: 1px solid var(--border); color: var(--text);
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 99; display: none;
    }
    .cart-backdrop.open { display: block; }
    .cart-head {
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cart-body { flex: 1; overflow: auto; padding: 16px; }
    .cart-item {
      display: flex; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .cart-foot { padding: 20px; border-top: 1px solid var(--border); }
    .cart-foot .total { font-size: 1.3rem; font-weight: 700; margin-bottom: 14px; color: var(--accent); }
    .qty-btn {
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      width: 28px; height: 28px; cursor: pointer; border-radius: 8px;
    }
    .api-badge {
      font-size: 11px; background: var(--card); color: var(--success);
      border: 1px solid var(--border); padding: 4px 10px; border-radius: 99px;
    }
    .api-badge.down { color: var(--danger); }
    .header-links {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .ha-link {
      color: var(--text-muted); font-size: 0.82rem; font-weight: 600;
      padding: 6px 8px; border-radius: 10px;
    }
    .ha-link:hover { color: var(--primary); background: var(--primary-soft); }
    .ha-link strong { display: block; color: var(--text); font-size: 0.88rem; }
    .product-image img {
      max-height: 100px; max-width: 100%; object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ========== HEADER ========== -->
  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="index.html">M<span>place</span> Energy</a>

      <div class="header-actions">
        <button type="button" class="theme-btn" id="themeToggle" title="Тема">🌙</button>
        <div id="localeMount"></div>
        <span class="api-badge" id="apiBadge" data-i18n="api.loading">API …</span>
        <div class="header-links">
          <a class="ha-link" href="/orders.html">
            <span>Заявки</span>
            <strong data-i18n="nav.orders">Мои заявки</strong>
          </a>
          <a class="ha-link" href="/rfqs.html">
            <span>RFQ</span>
            <strong>Запросы</strong>
          </a>
          <a class="ha-link" href="/account.html" id="accountLink">
            <span id="helloLine" data-i18n="hello.signIn">Войти</span>
            <strong data-i18n="nav.account">Аккаунт</strong>
          </a>
          <a class="ha-link" href="login.html?email=merchant@demo.com">
            <span data-i18n="nav.sell">Sell</span>
            <strong data-i18n="nav.sellOn">on Mplace</strong>
          </a>
          <a class="ha-link" href="login.html?email=superadmin@demo.com">
            <strong data-i18n="nav.admin">Admin</strong>
          </a>
        </div>
        <button type="button" class="cart-btn" id="cartBtn">
          🛒 <span data-i18n="nav.cart">Корзина</span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ========== MAIN LAYOUT ========== -->
  <div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <h3 data-i18n="search.title">Поиск</h3>
      <input type="search" class="search-box" id="searchInput" placeholder="Название, SKU..." data-i18n-placeholder="search.placeholder" />

      <h3 data-i18n="search.category">Категории</h3>
      <div class="filter-group" id="categoryFilters">
        <label><input type="radio" name="category" value="" checked /> <span data-i18n="search.allCategories">Все категории</span></label>
      </div>

      <h3 data-i18n="search.vendors">Поставщики</h3>
      <div class="filter-group" id="vendorFilters">
        <label><input type="radio" name="vendor" value="" checked /> <span data-i18n="search.allVendors">Все поставщики</span></label>
      </div>

      <h3 data-i18n="search.stock">Наличие</h3>
      <div class="filter-group">
        <label><input type="checkbox" id="inStockOnly" /> <span data-i18n="search.inStockOnly">Только в наличии</span></label>
      </div>

      <h3 data-i18n="search.sort">Сортировка</h3>
      <select class="filter-select" id="sortSelect">
        <option value="default" data-i18n="search.sortDefault">По умолчанию</option>
        <option value="price-asc" data-i18n="search.sortPriceAsc">Цена ↑</option>
        <option value="price-desc" data-i18n="search.sortPriceDesc">Цена ↓</option>
        <option value="name" data-i18n="search.sortName">Название</option>
        <option value="stock" data-i18n="search.sortStock">Остаток</option>
      </select>

      <button type="button" class="btn-add" style="width:100%; margin-top:20px;" id="applyFiltersBtn" data-i18n="search.apply">Применить</button>
      <button type="button" class="btn-remove" id="resetFiltersBtn" style="width:100%; margin-top:10px; padding:12px; border:1px solid var(--border); border-radius:12px; background:transparent; color:var(--text-muted); cursor:pointer; font-weight:600;">Сбросить всё</button>
    </aside>

    <!-- PRODUCTS AREA -->
    <main>
      <button type="button" class="mobile-filter-btn" id="mobileFilterBtn">☰ Фильтры</button>

      <div class="products-header">
        <h2>
          <span data-i18n="section.products">Оборудование и материалы</span>
          <span id="prodCount" style="font-size:1rem; font-weight:400; opacity:0.7; margin-left:8px;"></span>
        </h2>
      </div>

      <div class="products-grid" id="productsGrid">
        <p data-i18n="common.loading">Загрузка…</p>
      </div>
    </main>
  </div>

  <div style="position:fixed;bottom:10px;left:10px;z-index:40;font-size:11px;opacity:.55;color:var(--text-muted);pointer-events:none;font-family:ui-monospace,monospace">
    design: premium · build c377cee+
  </div>

  <!-- CART DRAWER -->
  <div class="cart-backdrop" id="cartBackdrop"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-head">
      <strong data-i18n="cart.title">Ваша заявка</strong>
      <button type="button" id="closeCart" style="border:none;background:none;font-size:24px;cursor:pointer;color:var(--text)">&times;</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-foot">
      <div class="total"><span data-i18n="cart.total">Итого</span>: <span id="cartTotal">—</span></div>
      <a class="btn-add" href="cart.html" style="display:block;text-align:center;text-decoration:none;" data-i18n="cart.checkout">Оформить заявку</a>
    </div>
  </aside>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;
    const icons = ['🛢️', '⚙️', '🔧', '🦺', '🚰', '📡', '🧪', '🏗️', '🔩', '🏭'];
    let allProducts = [];
    let allCategories = [];
    let allShops = [];

    // ===== Theme =====
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });
    setTheme(localStorage.getItem('mplace_theme') || 'dark');

    // ===== Mobile Sidebar =====
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const mobileFilterBtn = document.getElementById('mobileFilterBtn');

    function openSidebar(open) {
      if (!sidebar) return;
      sidebar.classList.toggle('open', open);
      if (sidebarBackdrop) sidebarBackdrop.classList.toggle('open', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }

    if (mobileFilterBtn) {
      mobileFilterBtn.addEventListener('click', () => openSidebar(true));
    }
    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener('click', () => openSidebar(false));
    }

    // ===== Cart =====
    function openCart(open) {
      document.getElementById('cartDrawer').classList.toggle('open', open);
      document.getElementById('cartBackdrop').classList.toggle('open', open);
    }
    document.getElementById('cartBtn').addEventListener('click', () => {
      openCart(true);
      refreshCart();
    });
    document.getElementById('closeCart').addEventListener('click', () => openCart(false));
    document.getElementById('cartBackdrop').addEventListener('click', () => openCart(false));

    async function refreshCart() {
      try {
        const cart = await MplaceApi.cart();
        document.getElementById('cartCount').textContent = cart.itemCount || 0;
        document.getElementById('cartTotal').textContent = I.formatMoney(cart.subtotalCents || 0);

        const body = document.getElementById('cartBody');
        if (!cart.items?.length) {
          body.innerHTML = `<p style="opacity:0.6; text-align:center; margin-top:40px;">${I.t('cart.empty')}</p>`;
          return;
        }
        body.innerHTML = cart.items.map((item) => {
          const unit = item.product?.priceCents ?? item.priceCents ?? 0;
          const e = escapeHtml;
          return `
          <div class="cart-item">
            <div style="flex:1">
              <div style="font-weight:600">${e(item.product?.name || 'Товар')}</div>
              <div style="font-size:13px; opacity:0.7">${e(item.product?.shop?.name || '')} · ${e(I.formatMoney(unit))}</div>
              <div style="margin-top:6px">
                <button type="button" class="qty-btn" data-dec="${e(item.id)}">−</button>
                <span style="margin:0 8px">${e(item.quantity)}</span>
                <button type="button" class="qty-btn" data-inc="${e(item.id)}">+</button>
              </div>
            </div>
            <div style="font-weight:700;color:var(--accent)">${e(I.formatMoney(unit * item.quantity))}</div>
          </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('cartCount').textContent = '0';
        console.warn('Cart error', e);
      }
    }

    document.getElementById('cartBody').addEventListener('click', async (e) => {
      const dec = e.target.closest('[data-dec]');
      const inc = e.target.closest('[data-inc]');
      if (!dec && !inc) return;
      try {
        const cart = await MplaceApi.cart();
        const id = (dec || inc).dataset.dec || (dec || inc).dataset.inc;
        const item = cart.items.find((i) => i.id === id);
        if (!item) return;
        await MplaceApi.updateCartItem(id, dec ? item.quantity - 1 : item.quantity + 1);
        await refreshCart();
      } catch (ex) {
        alert(ex.message);
      }
    });

    // ===== Render products =====
    function productImageHtml(p, i) {
      const fallback = icons[i % icons.length];
      if (p.imageUrl) {
        // Validate URL protocol — block javascript:
        const raw = String(p.imageUrl || '');
        const safeUrl = /^(https?:|\/|data:image\/)/i.test(raw) ? escapeAttr(raw) : '';
        if (!safeUrl) return fallback;
        return `<img src="${safeUrl}" alt="${escapeAttr(p.name || '')}" loading="lazy" onerror="this.style.display='none'" />`;
      }
      return fallback;
    }

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      document.getElementById('prodCount').textContent = `(${products.length})`;

      if (!products.length) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="icon">🔍</div>
            <h3 style="margin-bottom: 8px; font-size: 1.3rem;">Ничего не найдено</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Попробуйте изменить фильтры или поисковый запрос</p>
            <button type="button" class="btn-add" id="emptyResetBtn">Сбросить фильтры</button>
          </div>
        `;
        document.getElementById('emptyResetBtn')?.addEventListener('click', resetFilters);
        return;
      }

      grid.innerHTML = products.map((p, i) => {
        const e = escapeHtml;
        const stockClass = p.stock > 10 ? 'stock-ok' : 'stock-low';
        const stockText = p.stock > 0
          ? (I.t('product.stock', { n: p.stock }) || `В наличии: ${p.stock}`)
          : 'Нет в наличии';
        const lowBadge = p.stock < 8 && p.stock > 0
          ? '<span class="product-badge">Мало</span>'
          : (p.status === 'ACTIVE' ? '<span class="product-badge">Live</span>' : '');

        const href = '/product.html?id=' + encodeURIComponent(p.slug || p.id);
        return `
          <article class="product-card" style="cursor:pointer" onclick="location.href='${escapeAttr(href)}'">
            <div class="product-image">
              ${productImageHtml(p, i)}
              ${lowBadge}
            </div>
            <div class="product-body">
              <div class="product-category">${e(p.category?.name || I.t('common.general') || '')}</div>
              <h3 class="product-title">${e(p.name)}</h3>
              <div class="product-meta">
                ${e(p.shop?.name || '')} · <span class="${stockClass}">${e(stockText)}</span>
              </div>
              <div class="product-footer">
                <div class="product-price">${I.formatMoney(p.priceCents)}</div>
                <div style="display:flex;gap:8px;align-items:center;">
                  <button type="button" class="btn-add btn-wish" data-id="${escapeAttr(p.id)}" title="В избранное" onclick="event.stopPropagation(); toggleWishlist(this)" style="min-width:40px;padding:8px 10px;">♡</button>
                  <button type="button" class="btn-add" data-id="${escapeAttr(p.id)}" onclick="event.stopPropagation()">${e(I.t('product.addToCart') || 'В заявку')}</button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // ===== Filters (smart search + URL sync) =====
    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const category = document.querySelector('input[name="category"]:checked')?.value || '';
      const vendor = document.querySelector('input[name="vendor"]:checked')?.value || '';
      const inStockOnly = document.getElementById('inStockOnly')?.checked || false;
      const sort = document.getElementById('sortSelect')?.value || 'default';

      let filtered = [...allProducts];

      if (search) {
        filtered = filtered.filter((p) => {
          const name = (p.name || '').toLowerCase();
          const desc = (p.description || '').toLowerCase();
          const sku = (p.sku || '').toLowerCase();
          const shop = (p.shop?.name || '').toLowerCase();
          const cat = (p.category?.name || '').toLowerCase();
          return name.includes(search) || desc.includes(search) || sku.includes(search) ||
            shop.includes(search) || cat.includes(search);
        });
      }

      if (category) {
        filtered = filtered.filter((p) => p.categoryId === category || p.category?.id === category);
      }
      if (vendor) {
        filtered = filtered.filter((p) => p.shopId === vendor || p.shop?.id === vendor);
      }
      if (inStockOnly) {
        filtered = filtered.filter((p) => p.stock > 0);
      }

      if (sort === 'price-asc') filtered.sort((a, b) => a.priceCents - b.priceCents);
      if (sort === 'price-desc') filtered.sort((a, b) => b.priceCents - a.priceCents);
      if (sort === 'name') filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      if (sort === 'stock') filtered.sort((a, b) => b.stock - a.stock);

      renderProducts(filtered);
      updateUrlParams({ search, category, vendor, inStockOnly, sort });
      refreshWishSet();

      if (window.innerWidth <= 900) {
        openSidebar(false);
      }
    }

    function updateUrlParams(params) {
      const url = new URL(window.location.href);
      if (params.search) url.searchParams.set('q', params.search);
      else url.searchParams.delete('q');
      if (params.category) url.searchParams.set('category', params.category);
      else url.searchParams.delete('category');
      if (params.vendor) url.searchParams.set('vendor', params.vendor);
      else url.searchParams.delete('vendor');
      if (params.inStockOnly) url.searchParams.set('instock', '1');
      else url.searchParams.delete('instock');
      if (params.sort && params.sort !== 'default') url.searchParams.set('sort', params.sort);
      else url.searchParams.delete('sort');
      window.history.replaceState({}, '', url);
    }

    function loadFiltersFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q');
      if (q) document.getElementById('searchInput').value = q;

      const category = params.get('category');
      if (category) {
        document.querySelectorAll('input[name="category"]').forEach((el) => {
          if (el.value === category) el.checked = true;
        });
      }

      const vendor = params.get('vendor');
      if (vendor) {
        document.querySelectorAll('input[name="vendor"]').forEach((el) => {
          if (el.value === vendor) el.checked = true;
        });
      }

      if (params.get('instock') === '1') {
        document.getElementById('inStockOnly').checked = true;
      }

      const sort = params.get('sort');
      if (sort) document.getElementById('sortSelect').value = sort;
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('input[name="category"]').forEach((el) => {
        el.checked = el.value === '';
      });
      document.querySelectorAll('input[name="vendor"]').forEach((el) => {
        el.checked = el.value === '';
      });
      document.getElementById('inStockOnly').checked = false;
      document.getElementById('sortSelect').value = 'default';
      applyFilters();
    }

    document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
    document.getElementById('resetFiltersBtn')?.addEventListener('click', resetFilters);
    document.getElementById('sortSelect').addEventListener('change', applyFilters);
    document.getElementById('inStockOnly').addEventListener('change', applyFilters);

    let searchTimeout = null;
    document.getElementById('searchInput')?.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => applyFilters(), 350);
    });

    // ===== Wishlist toggle (catalog cards) =====
    const wishSet = new Set();
    async function refreshWishSet() {
      try {
        if (!MplaceApi.getToken || !MplaceApi.getToken()) return;
        const data = await MplaceApi.request('/wishlist');
        const items = Array.isArray(data) ? data : (data.items || []);
        wishSet.clear();
        items.forEach((it) => {
          const id = it.productId || it.product?.id;
          if (id) wishSet.add(id);
        });
        document.querySelectorAll('.btn-wish').forEach((btn) => {
          const on = wishSet.has(btn.dataset.id);
          btn.textContent = on ? '♥' : '♡';
          btn.style.color = on ? '#ef4444' : '';
        });
      } catch (_) { /* guest / offline */ }
    }

    async function toggleWishlist(btn) {
      const productId = btn?.dataset?.id;
      if (!productId) return;
      if (!MplaceApi.getToken || !MplaceApi.getToken()) {
        location.href = '/login.html?email=customer@demo.com&next=/';
        return;
      }
      btn.disabled = true;
      try {
        if (wishSet.has(productId)) {
          await MplaceApi.request('/wishlist/' + productId, { method: 'DELETE' });
          wishSet.delete(productId);
          btn.textContent = '♡';
          btn.style.color = '';
        } else {
          await MplaceApi.request('/wishlist', {
            method: 'POST',
            body: { productId },
          });
          wishSet.add(productId);
          btn.textContent = '♥';
          btn.style.color = '#ef4444';
        }
      } catch (ex) {
        alert(ex.message || 'Ошибка избранного');
      } finally {
        btn.disabled = false;
      }
    }
    window.toggleWishlist = toggleWishlist;

    // ===== Add to cart =====
    document.getElementById('productsGrid').addEventListener('click', async (e) => {
      if (e.target.closest('.btn-wish')) return;
      const btn = e.target.closest('.btn-add:not(.btn-wish)');
      if (!btn || !btn.dataset.id) return;
      btn.disabled = true;
      try {
        await MplaceApi.addToCart(btn.dataset.id, 1);
        btn.textContent = I.t('product.added') || 'Добавлено';
        await refreshCart();
        openCart(true);
        setTimeout(() => {
          btn.textContent = I.t('product.addToCart') || 'В заявку';
          btn.disabled = false;
        }, 800);
      } catch (ex) {
        alert(ex.message || 'Ошибка добавления в заявку');
        btn.disabled = false;
      }
    });

    // ===== Init =====
    async function init() {
      I.mountSwitcher('#localeMount');

      const badge = document.getElementById('apiBadge');
      try {
        await MplaceApi.health();
        badge.textContent = I.t('api.ok') || 'API OK';
        badge.classList.remove('down');
      } catch {
        badge.textContent = I.t('api.off') || 'API off';
        badge.classList.add('down');
      }

      const user = MplaceApi.getUser();
      if (user) {
        document.getElementById('helloLine').textContent = I.t('hello.user', { name: user.name || user.email }) || user.email;
        const role = String(user.role || '').toUpperCase();
        if (role === 'ADMIN' || role === 'SUPER_ADMIN') document.getElementById('accountLink').href = 'admin/index.html';
        else if (role === 'MERCHANT') document.getElementById('accountLink').href = 'merchant/index.html';
      }

      try {
        const [products, categories, shops] = await Promise.all([
          MplaceApi.products(),
          MplaceApi.categories(),
          MplaceApi.shops(),
        ]);

        allProducts = Array.isArray(products) ? products : (products.items || []);
        allCategories = Array.isArray(categories) ? categories : [];
        allShops = Array.isArray(shops) ? shops : [];
        // wishlist hearts hydrate after first paint

        const catContainer = document.getElementById('categoryFilters');
        allCategories.forEach((c) => {
          catContainer.insertAdjacentHTML('beforeend', `
            <label>
              <input type="radio" name="category" value="${c.id}" />
              <span>${c.name}</span>
            </label>`);
        });
        catContainer.querySelectorAll('input[name="category"]').forEach((el) => {
          el.addEventListener('change', applyFilters);
        });

        const vendContainer = document.getElementById('vendorFilters');
        allShops.forEach((s) => {
          vendContainer.insertAdjacentHTML('beforeend', `
            <label>
              <input type="radio" name="vendor" value="${s.id}" />
              <span>${s.name}</span>
            </label>`);
        });
        vendContainer.querySelectorAll('input[name="vendor"]').forEach((el) => {
          el.addEventListener('change', applyFilters);
        });

        loadFiltersFromUrl();
        applyFilters();
        await refreshCart();
        I.applyDocument();
      } catch (err) {
        console.error(err);
        document.getElementById('productsGrid').innerHTML = `
          <div class="error-state" style="grid-column:1/-1">
            <div class="icon">⚠️</div>
            <h3>Ошибка загрузки</h3>
            <p style="color:var(--text-muted);margin:12px 0 20px">${err.message || 'Не удалось загрузить каталог'}</p>
            <button type="button" class="btn-add" onclick="location.reload()">Обновить</button>
          </div>`;
      }
    }

    window.addEventListener('mplace:locale', () => {
      I.applyDocument();
      applyFilters();
      refreshCart();
    });

    init();
  </script>
</body>
</html>
