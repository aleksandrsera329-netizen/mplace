<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace</title>
  <link rel="stylesheet" href="assets/css/store.css" />
  <link rel="stylesheet" href="assets/css/locale.css" />
  <style>
    .cart-drawer {
      position: fixed; top: 0; right: 0; width: min(400px, 100%); height: 100%;
      background: #fff; box-shadow: -4px 0 24px rgba(0,0,0,.15); z-index: 100;
      transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column;
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 99; display: none;
    }
    .cart-backdrop.open { display: block; }
    .cart-head { padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .cart-body { flex: 1; overflow: auto; padding: 12px; }
    .cart-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .cart-foot { padding: 16px; border-top: 1px solid #eee; }
    .cart-foot .total { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .qty-btn { border: 1px solid #ddd; background: #f7f7f7; width: 28px; height: 28px; cursor: pointer; border-radius: 4px; }
    .api-badge { font-size: 11px; background: #232f3e; color: #0f0; padding: 2px 8px; border-radius: 10px; margin-inline-start: 8px; }
    .api-badge.down { color: #f66; }
  </style>
</head>
<body>
  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="index.html">M<span>place</span></a>
      <div class="search-bar">
        <select aria-label="Category" id="catFilter"><option value="" data-i18n="search.all">All</option></select>
        <input type="search" data-i18n-placeholder="search.placeholder" placeholder="Search…" id="searchInput" />
        <button type="button" id="searchBtn" title="Search">🔍</button>
      </div>
      <div id="localeMount"></div>
      <div class="header-actions">
        <a class="ha-item" href="login.html" id="accountLink"><span id="helloLine" data-i18n="hello.signIn">Hello</span><strong data-i18n="nav.account">Account</strong></a>
        <a class="ha-item" href="login.html?email=merchant@demo.com"><span data-i18n="nav.sell">Sell</span><strong data-i18n="nav.sellOn">on Mplace</strong></a>
        <a class="ha-item" href="login.html?email=superadmin@demo.com"><strong data-i18n="nav.admin">Admin</strong></a>
        <a class="ha-item" href="#" id="cartBtn"><strong>🛒 <span data-i18n="nav.cart">Cart</span> <span class="cart-count" id="cartCount">0</span></strong></a>
      </div>
    </div>
    <nav class="header-nav">
      <a href="#products" data-i18n="nav.products">PRODUCTS</a>
      <a href="#vendors" data-i18n="nav.vendors">VENDORS</a>
      <a href="#categories" data-i18n="nav.categories">CATEGORIES</a>
      <a href="cart.html" data-i18n="nav.checkout">CHECKOUT</a>
      <a href="login.html" data-i18n="nav.login">LOGIN</a>
      <span class="api-badge" id="apiBadge" data-i18n="api.loading">API …</span>
    </nav>
  </header>

  <div class="flash-banner" data-i18n="flash.banner">⚡ Live marketplace</div>

  <section class="hero">
    <h1 data-i18n="hero.title">Welcome</h1>
    <p data-i18n="hero.sub">Multi-vendor</p>
    <a class="btn-hero" href="#products" data-i18n="hero.cta">Shop Now</a>
  </section>

  <main class="container">
    <section class="section" id="categories">
      <h2 class="section-title" data-i18n="section.categories">Categories</h2>
      <div class="cats-grid" id="catsGrid"></div>
    </section>
    <section class="section" id="products">
      <h2 class="section-title"><span data-i18n="section.products">Products</span> <span id="prodCount" style="font-size:14px;font-weight:400;opacity:.7"></span></h2>
      <div class="products-grid" id="productsGrid"><p data-i18n="common.loading">Loading…</p></div>
    </section>
    <section class="section" id="vendors">
      <h2 class="section-title" data-i18n="section.vendors">Vendors</h2>
      <div class="vendors-row" id="vendorsRow"></div>
    </section>
  </main>

  <div class="cart-backdrop" id="cartBackdrop"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-head">
      <strong data-i18n="cart.title">Your Cart</strong>
      <button type="button" id="closeCart" style="border:none;background:none;font-size:22px;cursor:pointer">&times;</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-foot">
      <div class="total"><span data-i18n="cart.total">Total</span>: <span id="cartTotal">—</span></div>
      <a class="btn-add" href="cart.html" style="display:block;text-align:center;text-decoration:none;color:#111" data-i18n="cart.checkout">Checkout</a>
    </div>
  </aside>

  <footer class="store-footer">
    <div class="footer-bottom">
      <div class="logo">M<span>place</span></div>
      <div data-i18n="footer.copy">© 2026 Mplace</div>
    </div>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;
    const icons = ['🎧', '⌚', '👟', '🛋️', '🪴', '🧘', '📱', '🕶️', '💻', '🎒'];
    let allProducts = [];

    I.mountSwitcher('#localeMount');

    function openCart(open) {
      document.getElementById('cartDrawer').classList.toggle('open', open);
      document.getElementById('cartBackdrop').classList.toggle('open', open);
    }

    async function refreshCart() {
      try {
        const cart = await MplaceApi.cart();
        document.getElementById('cartCount').textContent = cart.itemCount || 0;
        document.getElementById('cartTotal').textContent = I.formatMoney(cart.subtotalCents || 0);
        const body = document.getElementById('cartBody');
        if (!cart.items?.length) {
          body.innerHTML = `<p style="color:#666;padding:12px">${I.t('cart.empty')}</p>`;
          return;
        }
        body.innerHTML = cart.items.map(i => `
          <div class="cart-item">
            <div style="flex:1">
              <div><strong>${i.product.name}</strong></div>
              <div style="color:#666">${i.product.shop?.name || ''} · ${I.formatMoney(i.product.priceCents)}</div>
              <div style="margin-top:6px">
                <button class="qty-btn" data-dec="${i.id}">−</button>
                <span style="margin:0 8px">${i.quantity}</span>
                <button class="qty-btn" data-inc="${i.id}">+</button>
              </div>
            </div>
            <div>${I.formatMoney(i.product.priceCents * i.quantity)}</div>
          </div>`).join('');
      } catch {
        document.getElementById('cartCount').textContent = '0';
      }
    }

    function renderProducts(list) {
      document.getElementById('prodCount').textContent = `(${list.length})`;
      document.getElementById('productsGrid').innerHTML = list.map((p, i) => `
        <article class="product-card">
          <div class="product-img">${icons[i % icons.length]}</div>
          <div class="product-body">
            <h3>${p.name}</h3>
            <div class="product-shop">${I.t('product.soldBy', { shop: p.shop?.name || '—' })}</div>
            <div class="product-rating">${p.category?.name || I.t('common.general')} · ${I.t('product.stock', { n: p.stock })}</div>
            <div class="product-price">${I.formatMoney(p.priceCents)}</div>
            <button class="btn-add" data-id="${p.id}">${I.t('product.addToCart')}</button>
          </div>
        </article>`).join('') || `<p>${I.t('admin.noProducts')}</p>`;
    }

    async function loadCatalog() {
      const badge = document.getElementById('apiBadge');
      try {
        await MplaceApi.health();
        badge.textContent = I.t('api.ok');
        badge.classList.remove('down');
      } catch {
        badge.textContent = I.t('api.off');
        badge.classList.add('down');
      }

      const user = MplaceApi.getUser();
      if (user) {
        document.getElementById('helloLine').textContent = I.t('hello.user', { name: user.name || user.email });
        const role = String(user.role || '').toUpperCase();
        if (role === 'ADMIN') document.getElementById('accountLink').href = 'admin/index.html';
        else if (role === 'MERCHANT') document.getElementById('accountLink').href = 'merchant/index.html';
      } else {
        document.getElementById('helloLine').textContent = I.t('hello.signIn');
      }

      try {
        const [products, categories, shops] = await Promise.all([
          MplaceApi.products(),
          MplaceApi.categories(),
          MplaceApi.shops(),
        ]);
        allProducts = products;
        renderProducts(products);

        document.getElementById('catsGrid').innerHTML = categories.map(c =>
          `<a class="cat-card" href="#products" data-cat="${c.id}"><div class="icon">📁</div><div class="name">${c.name}</div></a>`
        ).join('') || `<p>${I.t('admin.noCategories')}</p>`;

        const sel = document.getElementById('catFilter');
        sel.innerHTML = `<option value="">${I.t('search.all')}</option>`;
        categories.forEach(c => {
          const o = document.createElement('option');
          o.value = c.id; o.textContent = c.name;
          sel.appendChild(o);
        });

        document.getElementById('vendorsRow').innerHTML = shops.map(s =>
          `<div class="vendor-card">
            <div class="v-icon">${s.name.charAt(0)}</div>
            <h4>${s.name}</h4>
            <p>${s._count?.products ?? 0} · ${s.status}</p>
          </div>`
        ).join('');
      } catch (e) {
        document.getElementById('productsGrid').innerHTML =
          `<p style="color:#c00">${e.message}</p>`;
      }
      await refreshCart();
      I.applyDocument();
    }

    document.getElementById('productsGrid').addEventListener('click', async e => {
      const btn = e.target.closest('[data-id]');
      if (!btn) return;
      btn.disabled = true;
      try {
        await MplaceApi.addToCart(btn.dataset.id, 1);
        btn.textContent = I.t('product.added');
        await refreshCart();
        openCart(true);
        setTimeout(() => { btn.textContent = I.t('product.addToCart'); btn.disabled = false; }, 800);
      } catch (ex) {
        alert(ex.message);
        btn.disabled = false;
      }
    });

    document.getElementById('cartBody').addEventListener('click', async e => {
      const dec = e.target.closest('[data-dec]');
      const inc = e.target.closest('[data-inc]');
      if (!dec && !inc) return;
      try {
        const cart = await MplaceApi.cart();
        const id = (dec || inc).dataset.dec || (dec || inc).dataset.inc;
        const item = cart.items.find(i => i.id === id);
        if (!item) return;
        await MplaceApi.updateCartItem(id, dec ? item.quantity - 1 : item.quantity + 1);
        await refreshCart();
      } catch (ex) {
        alert(ex.message);
      }
    });

    document.getElementById('cartBtn').addEventListener('click', e => {
      e.preventDefault();
      openCart(true);
      refreshCart();
    });
    document.getElementById('closeCart').onclick = () => openCart(false);
    document.getElementById('cartBackdrop').onclick = () => openCart(false);

    document.getElementById('searchBtn').onclick = () => {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const cat = document.getElementById('catFilter').value;
      renderProducts(allProducts.filter(p => {
        const okQ = !q || p.name.toLowerCase().includes(q);
        const okC = !cat || p.categoryId === cat || p.category?.id === cat;
        return okQ && okC;
      }));
    };

    window.addEventListener('mplace:locale', () => {
      I.applyDocument();
      renderProducts(
        document.getElementById('catFilter').value || document.getElementById('searchInput').value
          ? allProducts.filter(p => {
              const q = document.getElementById('searchInput').value.trim().toLowerCase();
              const cat = document.getElementById('catFilter').value;
              return (!q || p.name.toLowerCase().includes(q)) && (!cat || p.categoryId === cat || p.category?.id === cat);
            })
          : allProducts
      );
      refreshCart();
      const badge = document.getElementById('apiBadge');
      if (badge && !badge.classList.contains('down')) badge.textContent = I.t('api.ok');
      else if (badge) badge.textContent = I.t('api.off');
      const user = MplaceApi.getUser();
      if (user) document.getElementById('helloLine').textContent = I.t('hello.user', { name: user.name || user.email });
      else document.getElementById('helloLine').textContent = I.t('hello.signIn');
    });

    loadCatalog();
  </script>
</body>
</html>
