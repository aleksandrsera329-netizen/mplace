!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RFQ — Mplace Energy</title>
  <base href="/" />

  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .rfq-page { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }

    .rfq-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .rfq-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .rfq-number { color: var(--text-muted); font-size: 0.95rem; }

    .status-badge {
      display: inline-flex;
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .status-OPEN { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .status-MATCHED { background: rgba(139,92,246,0.15); color: #a78bfa; }
    .status-QUOTED { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .status-AWARDED { background: rgba(16,185,129,0.15); color: #34d399; }
    .status-CLOSED, .status-CANCELLED { background: rgba(156,163,175,0.15); color: #9ca3af; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 18px; }

    .items-table { width: 100%; border-collapse: collapse; }
    .items-table th {
      text-align: left;
      padding: 10px 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .items-table td {
      padding: 14px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .offer-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    .offer-card:hover { border-color: var(--primary); }
    .offer-card.winner { border-color: #34d399; background: rgba(16,185,129,0.05); }

    .offer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-award {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-offer {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }

    .state-block {
      text-align: center;
      padding: 70px 20px;
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle">🌙</button>
        <div id="localeMount"></div>
        <a href="/rfqs.html" class="cart-btn" style="text-decoration:none;">← Мои RFQ</a>
      </div>
    </div>
  </header>

  <div class="rfq-page">
    <div id="rfqContent">
      <div style="text-align:center; padding:80px 0; opacity:0.6;">Загрузка RFQ...</div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>

  <script>
    const I = window.MplaceI18n;
    let currentRfq = null;
    let currentUser = null;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    I.mountSwitcher('#localeMount');

    function getStatusText(status) {
      const map = {
        OPEN: 'Открыт',
        MATCHED: 'Поиск поставщиков',
        QUOTED: 'Есть предложения',
        AWARDED: 'Выбран победитель',
        CLOSED: 'Закрыт',
        CANCELLED: 'Отменён',
        PENDING: 'Ожидает',
        ACCEPTED: 'Принят',
        REJECTED: 'Отклонён'
      };
      return map[status] || status;
    }

    function getIdFromUrl() {
      return new URLSearchParams(window.location.search).get('id');
    }

    async function loadRfq() {
      const id = getIdFromUrl();
      if (!id) {
        showError('Не указан ID заявки');
        return;
      }

      currentUser = MplaceApi.getUser?.() || JSON.parse(sessionStorage.getItem('mplace_user') || 'null');

      try {
        currentRfq = await MplaceApi.rfq(id);
        renderRfq(currentRfq);
        document.title = `${currentRfq.number || 'RFQ'} — Mplace Energy`;
      } catch (err) {
        console.error(err);
        showError(err.status === 404 ? 'RFQ не найден' : 'Нет доступа или ошибка загрузки');
      }
    }

    function showError(msg) {
      const e = typeof escapeHtml === 'function' ? escapeHtml : (s) => String(s ?? '');
      document.getElementById('rfqContent').innerHTML = `
        <div class="state-block">
          <div style="font-size:3.5rem; margin-bottom:16px; opacity:0.5;">⚠️</div>
          <h2>${e(msg)}</h2>
          <a href="/rfqs.html" class="btn-offer" style="display:inline-block; width:auto; margin-top:24px; text-decoration:none;">К списку RFQ</a>
        </div>`;
    }

    function renderRfq(rfq) {
      const e = typeof escapeHtml === 'function' ? escapeHtml : (s) => String(s ?? '');
      const isBuyer = currentUser && (currentUser.id === rfq.buyerId || ['ADMIN','SUPER_ADMIN'].includes((currentUser.role||'').toUpperCase()));
      const isMerchant = currentUser && ['MERCHANT','ADMIN','SUPER_ADMIN'].includes((currentUser.role||'').toUpperCase());

      const itemsHtml = (rfq.items || []).map(item => `
        <tr>
          <td>
            <div style="font-weight:600;">${e(item.name)}</div>
            <div style="font-size:0.85rem; color:var(--text-muted);">${e(item.specs || '')}</div>
          </td>
          <td style="text-align:center;">${e(item.quantity)} ${e(item.unit || 'шт')}</td>
        </tr>
      `).join('');

      const offersHtml = (rfq.offers || []).length === 0 
        ? `<div style="text-align:center; padding:30px 0; color:var(--text-muted);">Предложений пока нет</div>`
        : rfq.offers.map(offer => {
            const isWinner = rfq.awardedOfferId === offer.id;
            return `
              <div class="offer-card ${isWinner ? 'winner' : ''}">
                <div class="offer-header">
                  <div>
                    <div style="font-weight:700;">${e(offer.shop?.name || 'Поставщик')}</div>
                    <div style="font-size:0.85rem; color:var(--text-muted);">
                      ${e(getStatusText(offer.status))} · ${e(new Date(offer.createdAt).toLocaleDateString('ru-RU'))}
                    </div>
                  </div>
                  <div style="font-size:1.2rem; font-weight:800; color:var(--primary);">
                    ${e(I.formatMoney(offer.totalCents))}
                  </div>
                </div>
                ${offer.message ? `<div style="font-size:0.9rem; margin:10px 0; color:var(--text-muted);">${e(offer.message)}</div>` : ''}
                ${isBuyer && offer.status === 'PENDING' && !rfq.awardedOfferId ? `
                  <button class="btn-award" onclick="awardOffer('${e(offer.id)}')">Выбрать это предложение</button>
                ` : ''}
                ${isWinner ? `<div style="margin-top:10px; color:#34d399; font-weight:600;">✓ Выбранное предложение</div>` : ''}
              </div>
            `;
          }).join('');

      document.getElementById('rfqContent').innerHTML = `
        <div class="rfq-header">
          <div>
            <div class="rfq-title">${e(rfq.title)}</div>
            <div class="rfq-number">${e(rfq.number)} · Создан ${e(new Date(rfq.createdAt).toLocaleDateString('ru-RU'))}</div>
          </div>
          <div class="status-badge status-${e(rfq.status)}">${e(getStatusText(rfq.status))}</div>
        </div>

        <div class="grid-2">
          <div>
            <!-- Позиции -->
            <div class="card">
              <h2>Позиции запроса</h2>
              <table class="items-table">
                <thead>
                  <tr>
                    <th>Наименование</th>
                    <th style="text-align:center;">Количество</th>
                  </tr>
                </thead>
                <tbody>${itemsHtml}</tbody>
              </table>
            </div>

            <!-- Предложения -->
            <div class="card">
              <h2>Предложения поставщиков (${rfq.offers?.length || 0})</h2>
              ${offersHtml}
            </div>
          </div>

          <div>
            <!-- Информация -->
            <div class="card">
              <h2>Информация</h2>
              <div style="font-size:0.95rem; line-height:1.7;">
                <div><strong>Покупатель:</strong> ${e(rfq.buyer?.name || rfq.buyer?.email || '—')}</div>
                ${rfq.deadline ? `<div><strong>Срок:</strong> ${e(new Date(rfq.deadline).toLocaleDateString('ru-RU'))}</div>` : ''}
                <div style="margin-top:12px; color:var(--text-muted);">${e(rfq.description || 'Без описания')}</div>
              </div>
            </div>

            <!-- Действия для поставщика -->
            ${isMerchant && !rfq.awardedOfferId && ['OPEN','MATCHED','QUOTED'].includes(rfq.status) ? `
              <div class="card">
                <h2>Ваше предложение</h2>
                <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:12px;">
                  Отправьте коммерческое предложение по этой заявке
                </p>
                <button class="btn-offer" onclick="location.href='/rfq-offer.html?id=${e(rfq.id)}'">
                  Отправить предложение
                </button>
              </div>
            ` : ''}

            <!-- Подобранные поставщики -->
            ${rfq.matches?.length ? `
              <div class="card">
                <h2>Подобранные поставщики</h2>
                ${rfq.matches.slice(0,5).map(m => `
                  <div style="padding:8px 0; border-bottom:1px solid var(--border); font-size:0.95rem;">
                    ${e(m.shop?.name || 'Магазин')} <span style="color:var(--text-muted); font-size:0.8rem;">· score ${e(m.score)}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    async function awardOffer(offerId) {
      if (!confirm('Выбрать это предложение как победившее?')) return;
      try {
        await MplaceApi.awardRfqOffer(currentRfq.id, offerId);
        alert('Предложение успешно выбрано!');
        loadRfq();
      } catch (err) {
        console.error(err);
        alert('Ошибка при выборе предложения');
      }
    }

    loadRfq();
  </script>
</body>
</html>
