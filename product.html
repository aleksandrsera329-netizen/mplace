<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Товар — Mplace Energy</title>
  <base href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />
  <style>
    .product-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 28px 80px;
      position: relative;
      z-index: 1;
    }
    .breadcrumbs {
      display: flex;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .breadcrumbs a:hover { color: var(--primary); }
    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      margin-bottom: 80px;
    }
    .product-gallery {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      position: sticky;
      top: 100px;
      height: fit-content;
    }
    .main-image {
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6rem;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      position: relative;
    }
    [data-theme="light"] .main-image {
      background: linear-gradient(160deg, #e2e8f0, #f8fafc);
    }
    .main-image img {
      max-height: 320px;
      max-width: 90%;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }
    .product-info h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 16px;
    }
    .product-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    .product-price-big {
      font-size: 2.4rem;
      font-weight: 800;
      margin: 28px 0;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .qty-control button {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .qty-control button:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .qty-control input {
      width: 70px;
      height: 44px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
    }
    .action-buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 16px 32px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(245, 158, 11, 0.45);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }
    .product-description {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 60px;
    }
    .product-description h2 {
      font-size: 1.4rem;
      margin-bottom: 16px;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .spec-item {
      background: var(--bg);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .spec-item span {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .similar-section h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 28px;
    }
    .cart-drawer {
      position: fixed; top: 0; right: 0; width: min(400px, 100%); height: 100%;
      background: var(--card); box-shadow: -8px 0 30px rgba(0,0,0,.5); z-index: 100;
      transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column;
      border-left: 1px solid var(--border); color: var(--text);
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 99; display: none;
    }
    .cart-backdrop.open { display: block; }
    .cart-head {
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cart-body { flex: 1; overflow: auto; padding: 16px; }
    .cart-item {
      display: flex; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .cart-foot { padding: 20px; border-top: 1px solid var(--border); }
    .cart-foot .total { font-size: 1.3rem; font-weight: 700; margin-bottom: 14px; color: var(--accent); }
    @media (max-width: 900px) {
      .product-layout { grid-template-columns: 1fr; gap: 40px; }
      .product-gallery { position: static; }
      .main-image { height: 340px; }
      .product-info h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button type="button" class="theme-btn" id="themeToggle" title="Тема">🌙</button>
        <div id="localeMount"></div>
        <a class="icon-btn" href="/login.html" title="Аккаунт">👤</a>
        <button type="button" class="cart-btn" id="cartBtn">
          🛒 <span data-i18n="nav.cart">Корзина</span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="product-page">
    <div class="breadcrumbs" id="breadcrumbs">
      <a href="/" data-i18n="admin.home">Главная</a>
      <span>›</span>
      <a href="/#products" data-i18n="section.products">Каталог</a>
      <span>›</span>
      <span id="breadcrumbName">Товар</span>
    </div>

    <div class="product-layout" id="productContent">
      <div style="grid-column: 1 / -1; text-align: center; padding: 100px 0; opacity: 0.6;" data-i18n="common.loading">
        Загрузка товара...
      </div>
    </div>

    <section class="similar-section" id="similarSection" style="display: none;">
      <h2 data-i18n="product.similar">Похожие товары</h2>
      <div class="products-grid" id="similarGrid"></div>
    </section>
  </div>

  <div class="cart-backdrop" id="cartBackdrop"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-head">
      <strong data-i18n="cart.title">Ваша заявка</strong>
      <button type="button" id="closeCart" style="border:none;background:none;font-size:24px;cursor:pointer;color:var(--text)">&times;</button>
    </div>
    <div class="cart-body" id="cartBody"></div>
    <div class="cart-foot">
      <div class="total"><span data-i18n="cart.total">Итого</span>: <span id="cartTotal">—</span></div>
      <a class="btn-add" href="/cart.html" style="display:block;text-align:center;text-decoration:none;" data-i18n="cart.checkout">Оформить заявку</a>
    </div>
  </aside>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;
    let currentProduct = null;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () =>
      setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    setTheme(localStorage.getItem('mplace_theme') || 'dark');

    // Cart
    function openCart(open) {
      document.getElementById('cartDrawer').classList.toggle('open', open);
      document.getElementById('cartBackdrop').classList.toggle('open', open);
    }
    document.getElementById('cartBtn').onclick = () => { openCart(true); refreshCart(); };
    document.getElementById('closeCart').onclick = () => openCart(false);
    document.getElementById('cartBackdrop').onclick = () => openCart(false);

    async function refreshCart() {
      try {
        const cart = await MplaceApi.cart();
        document.getElementById('cartCount').textContent = cart.itemCount || 0;
        document.getElementById('cartTotal').textContent = I.formatMoney(cart.subtotalCents || 0);
        const body = document.getElementById('cartBody');
        if (!cart.items?.length) {
          body.innerHTML = `<p style="opacity:0.6;text-align:center;margin-top:40px;">${I.t('cart.empty')}</p>`;
          return;
        }
        body.innerHTML = cart.items.map((item) => {
          const unit = item.product?.priceCents ?? 0;
          return `<div class="cart-item">
            <div style="flex:1">
              <div style="font-weight:600">${item.product?.name || ''}</div>
              <div style="font-size:13px;opacity:0.7">${item.quantity} × ${I.formatMoney(unit)}</div>
            </div>
          </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('cartCount').textContent = '0';
      }
    }

    function productUrl(p) {
      const key = p.slug || p.id;
      return '/product.html?id=' + encodeURIComponent(key);
    }

    function getSlugFromUrl() {
      const path = window.location.pathname.replace(/\\/g, '/');
      const parts = path.split('/').filter(Boolean);
      const productIdx = parts.indexOf('product');
      if (productIdx >= 0 && parts[productIdx + 1]) {
        return decodeURIComponent(parts[productIdx + 1].replace(/\.html$/, ''));
      }
      // product.html?id= / ?slug=
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || params.get('slug');
    }

    async function loadProduct() {
      const slug = getSlugFromUrl();
      if (!slug) {
        document.getElementById('productContent').innerHTML = '<p>Товар не найден</p>';
        return;
      }

      try {
        let found = null;
        // Try direct API by id first
        try {
          found = await MplaceApi.product(slug);
        } catch (_) {
          found = null;
        }

        if (!found) {
          const products = await MplaceApi.products();
          const list = Array.isArray(products) ? products : (products.items || []);
          found = list.find((p) => p.slug === slug || p.id === slug);
        }

        if (!found) {
          document.getElementById('productContent').innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <div class="icon">😕</div>
              <h3>Товар не найден</h3>
              <p style="color: var(--text-muted); margin: 12px 0 24px;">Возможно, он был удалён или ссылка устарела</p>
              <a href="/" class="btn-primary" style="display:inline-block; text-decoration:none;">Вернуться в каталог</a>
            </div>
          `;
          return;
        }

        currentProduct = found;
        renderProduct(currentProduct);
        loadSimilar(currentProduct);
        document.title = currentProduct.name + ' — Mplace Energy';
        I.applyDocument();
      } catch (err) {
        console.error(err);
        document.getElementById('productContent').innerHTML =
          '<p style="color:var(--danger)">Ошибка загрузки: ' + (err.message || '') + '</p>';
      }
    }

    function renderProduct(p) {
      document.getElementById('breadcrumbName').textContent = p.name;

      const stockText = p.stock > 0
        ? `<span style="color:var(--success)">В наличии: ${p.stock} шт.</span>`
        : `<span style="color:var(--danger)">Нет в наличии</span>`;

      document.getElementById('productContent').innerHTML = `
        <div class="product-gallery">
          <div class="main-image">
            ${p.imageUrl
              ? `<img src="${p.imageUrl}" alt="${String(p.name || '').replace(/"/g, '&quot;')}">`
              : '🛢️'}
          </div>
        </div>

        <div class="product-info">
          <div class="product-meta-row">
            <span>${p.category?.name || ''}</span>
            <span>•</span>
            <span>${p.shop?.name || ''}</span>
            <span>•</span>
            <span>SKU: ${p.sku || '—'}</span>
          </div>

          <h1>${p.name}</h1>
          <div>${stockText}</div>
          <div class="product-price-big">${I.formatMoney(p.priceCents)}</div>

          <div class="qty-control">
            <button type="button" id="qtyDec">−</button>
            <input type="number" id="qtyInput" value="1" min="1" max="${p.stock || 999}">
            <button type="button" id="qtyInc">+</button>
          </div>

          <div class="action-buttons">
            <button type="button" class="btn-primary" id="addBtn">+ В заявку</button>
            <button type="button" class="btn-secondary" id="contactBtn">Связаться с поставщиком</button>
          </div>

          <div class="product-description">
            <h2>Описание</h2>
            <p style="line-height:1.7; color:var(--text-muted)">${p.description || 'Описание отсутствует'}</p>
            <div class="specs-grid">
              <div class="spec-item">
                <span>Артикул (SKU)</span>
                <strong>${p.sku || '—'}</strong>
              </div>
              <div class="spec-item">
                <span>GTIN</span>
                <strong>${p.gtin || '—'}</strong>
              </div>
              <div class="spec-item">
                <span>Поставщик</span>
                <strong>${p.shop?.name || '—'}</strong>
              </div>
              <div class="spec-item">
                <span>Категория</span>
                <strong>${p.category?.name || '—'}</strong>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('qtyDec').onclick = () => changeQty(-1);
      document.getElementById('qtyInc').onclick = () => changeQty(1);
      document.getElementById('addBtn').onclick = addToRequest;
      document.getElementById('contactBtn').onclick = contactSupplier;
    }

    function changeQty(delta) {
      const input = document.getElementById('qtyInput');
      let val = parseInt(input.value, 10) + delta;
      if (isNaN(val) || val < 1) val = 1;
      if (currentProduct?.stock && val > currentProduct.stock) val = currentProduct.stock;
      input.value = val;
    }

    async function addToRequest() {
      const qty = parseInt(document.getElementById('qtyInput').value, 10) || 1;
      try {
        await MplaceApi.addToCart(currentProduct.id, qty);
        await refreshCart();
        openCart(true);
      } catch (e) {
        alert(e.message || 'Ошибка при добавлении в заявку');
      }
    }

    function contactSupplier() {
      const subject = encodeURIComponent('Запрос по товару: ' + currentProduct.name);
      const body = encodeURIComponent(
        'Здравствуйте!\n\nИнтересует товар: ' + currentProduct.name +
        '\nSKU: ' + (currentProduct.sku || '—') +
        '\n\nПрошу связаться со мной.'
      );
      window.location.href = 'mailto:sales@mplace.energy?subject=' + subject + '&body=' + body;
    }

    async function loadSimilar(product) {
      try {
        const products = await MplaceApi.products();
        const list = Array.isArray(products) ? products : (products.items || []);
        const similar = list
          .filter((p) => p.categoryId === product.categoryId && p.id !== product.id)
          .slice(0, 4);

        if (!similar.length) return;

        document.getElementById('similarSection').style.display = 'block';
        document.getElementById('similarGrid').innerHTML = similar.map((p) => `
          <article class="product-card" style="opacity:1;transform:none;cursor:pointer;" onclick="location.href='${productUrl(p)}'">
            <div class="product-image">
              ${p.imageUrl ? `<img src="${p.imageUrl}" alt="" style="max-height:100px;">` : '🛢️'}
            </div>
            <div class="product-body">
              <div class="product-category">${p.category?.name || ''}</div>
              <h3 class="product-title">${p.name}</h3>
              <div class="product-footer">
                <div class="product-price">${I.formatMoney(p.priceCents)}</div>
              </div>
            </div>
          </article>
        `).join('');
      } catch (e) {}
    }

    I.mountSwitcher('#localeMount');
    I.applyDocument();
    loadProduct();
    refreshCart();
  </script>
</body>
</html>
