# nginx.conf — production reverse proxy for Mplace
# Stage 22: security headers at edge; CORS handled by Nest API (allowlist)

upstream api_upstream {
    server api:3000;
    keepalive 32;
}

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Stage 22 security headers (edge). API also sets them via helmet.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-XSS-Protection "0" always;
    # CSP for HTML/static via web; API returns own CSP from helmet
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: ws:; font-src 'self' data: https:" always;

    # ======================
    # API (NestJS)
    # ======================
    # CORS is enforced by Nest (allowlist + credentials). Do NOT reflect $http_origin.
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # OPTIONS preflight proxied to Nest so CORS allowlist is authoritative
    }

    # Stage 2: never expose KYC / private storage via static path
    location ^~ /uploads/kyc/ {
        deny all;
        return 403;
    }
    location ^~ /uploads/private/ {
        deny all;
        return 403;
    }

    # Local uploads (API volume may be mounted on host; optional path)
    # Public product images etc. only — KYC blocked above
    location /uploads/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================
    # Next.js (Customer + Merchant + Admin)
    # ======================
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
