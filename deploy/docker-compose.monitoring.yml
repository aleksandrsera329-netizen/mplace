# Optional monitoring stack (TZ2 Stage 2)
# Usage: docker compose -f docker-compose.yml -f deploy/docker-compose.monitoring.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mplace-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mplace_prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mplace-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - mplace_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mplace_prom_data:
  mplace_grafana_data:
