<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace — Заказы магазина</title>

  <link rel="stylesheet" href="/assets/css/store-modern.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .page { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filters input, .filters select {
      padding: 9px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .filters input { min-width: 200px; }

    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: var(--bg-secondary); color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:hover td { background: var(--card-hover); }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-NEW, .badge-PENDING, .badge-PENDING_PAYMENT { background: #f59e0b33; color: #f59e0b; }
    .badge-PAID, .badge-PROCESSING { background: #3b82f633; color: #3b82f6; }
    .badge-SHIPPED { background: #8b5cf633; color: #8b5cf6; }
    .badge-COMPLETED { background: #10b98133; color: #10b981; }
    .badge-CANCELLED, .badge-REFUNDED, .badge-DISPUTED, .badge-PARTIALLY_REFUNDED { background: #ef444433; color: #ef4444; }

    .btn-sm {
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #000;
      margin-right: 4px;
    }
    .btn-sm.outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-sm.danger { background: #ef4444; color: #fff; }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    .btn {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

<header class="store-header">
  <div class="header-top">
    <a class="logo" href="/">M<span>place</span> Energy</a>
    <div class="header-actions">
      <button class="theme-btn" id="themeToggle">🌙</button>
      <div id="localeMount"></div>
      <a class="icon-btn" href="/merchant.html">🏪</a>
      <a class="icon-btn" href="/account.html">👤</a>
    </div>
  </div>
</header>

<div class="page">
  <div class="page-header">
    <div>
      <h1 style="margin:0;font-size:1.5rem;">Заказы магазина</h1>
      <div style="color:var(--text-muted);font-size:0.9rem;margin-top:4px;">Только заказы вашего магазина</div>
    </div>
    <a class="btn" href="/merchant.html">← В кабинет</a>
  </div>

  <div class="filters">
    <input type="search" id="searchInput" placeholder="Номер заказа / email…">
    <select id="statusFilter">
      <option value="">Все статусы</option>
      <option value="PENDING_PAYMENT">Pending payment</option>
      <option value="PAID">Paid</option>
      <option value="PROCESSING">Processing</option>
      <option value="SHIPPED">Shipped</option>
      <option value="COMPLETED">Completed</option>
      <option value="CANCELLED">Cancelled</option>
      <option value="DISPUTED">Disputed</option>
      <option value="REFUNDED">Refunded</option>
    </select>
    <button class="btn-sm" onclick="loadOrders(true)">Найти</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Номер</th>
          <th>Покупатель</th>
          <th>Сумма</th>
          <th>Позиций</th>
          <th>Статус</th>
          <th>Дата</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="7" style="text-align:center;padding:40px;opacity:0.6;">Загрузка…</td></tr>
      </tbody>
    </table>
    <div class="pagination">
      <button class="btn-sm outline" id="prevBtn" disabled>← Назад</button>
      <span id="pageInfo"></span>
      <button class="btn-sm outline" id="nextBtn">Вперёд →</button>
    </div>
  </div>
</div>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/api.js"></script>
<script>
  const I = window.MplaceI18n;
  let cursor = null;

  // Theme
  const themeToggle = document.getElementById('themeToggle');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('mplace_theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  themeToggle.onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  setTheme(localStorage.getItem('mplace_theme') || 'dark');
  if (I && I.mountSwitcher) I.mountSwitcher('#localeMount');

  function getToken() {
    return (window.MplaceApi && MplaceApi.getToken && MplaceApi.getToken())
      || sessionStorage.getItem('mplace_token')
      || localStorage.getItem('mplace_token')
      || '';
  }

  function money(cents) {
    if (I && I.formatMoney) return I.formatMoney(cents || 0);
    return '$' + ((cents || 0) / 100).toFixed(2);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/"/g, '&quot;');
  }

  async function api(path, opts = {}) {
    const token = getToken();
    const base = (window.MplaceApi && MplaceApi.getBase && MplaceApi.getBase()) || (location.origin + '/api');
    const res = await fetch(base + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        ...(opts.headers || {})
      }
    });
    if (res.status === 401) {
      location.href = '/login.html?email=merchant@demo.com&next=/merchant-orders.html';
      throw new Error('Unauthorized');
    }
    if (!res.ok) {
      let err = await res.text();
      try {
        const j = JSON.parse(err);
        err = Array.isArray(j.message) ? j.message.join(', ') : (j.message || err);
      } catch (_) {}
      throw new Error(typeof err === 'string' ? err : JSON.stringify(err));
    }
    return res.json();
  }

  async function loadOrders(reset = false) {
    if (reset) cursor = null;

    const q = new URLSearchParams({ limit: '20' });
    if (cursor) q.set('cursor', cursor);

    const search = document.getElementById('searchInput').value.trim();
    const status = document.getElementById('statusFilter').value;
    if (search) q.set('search', search);
    if (status) q.set('status', status);

    try {
      // API filters by shopId for MERCHANT
      const data = await api('/orders?' + q);
      const items = data.items || data || [];

      document.getElementById('ordersBody').innerHTML = items.length
        ? items.map(o => `
            <tr>
              <td>
                <a href="/order.html?id=${esc(o.id)}" style="color:var(--primary);font-weight:600;">
                  ${esc(o.orderNumber || String(o.id).slice(0, 8))}
                </a>
              </td>
              <td>${esc(o.customer?.email || o.customerEmail || o.customer?.name || o.buyer?.email || '—')}</td>
              <td>${money(o.totalCents)}</td>
              <td>${o._count?.items || o.items?.length || 0}</td>
              <td><span class="badge badge-${esc(o.status)}">${esc(o.status)}</span></td>
              <td>${new Date(o.createdAt).toLocaleString('ru-RU')}</td>
              <td>${renderActions(o)}</td>
            </tr>
          `).join('')
        : '<tr><td colspan="7" style="text-align:center;padding:40px;opacity:0.6;">Заказов нет</td></tr>';

      cursor = data.nextCursor || null;
      document.getElementById('nextBtn').disabled = !data.hasMore;
      document.getElementById('pageInfo').textContent =
        items.length + ' записей' + (data.hasMore ? ' · есть ещё' : '');
    } catch (e) {
      document.getElementById('ordersBody').innerHTML =
        `<tr><td colspan="7" style="text-align:center;color:#ef4444;">Ошибка: ${esc(e.message)}</td></tr>`;
    }
  }

  // Merchant status machine: PAID→PROCESSING→SHIPPED
  function renderActions(o) {
    const actions = [];
    if (o.status === 'PAID') {
      actions.push(`<button type="button" class="btn-sm" onclick="setStatus('${esc(o.id)}','PROCESSING')">В работу</button>`);
    }
    if (o.status === 'PROCESSING') {
      actions.push(`<button type="button" class="btn-sm" onclick="setStatus('${esc(o.id)}','SHIPPED')">Отправить</button>`);
    }
    actions.push(`<a class="btn-sm outline" href="/order.html?id=${esc(o.id)}">Открыть</a>`);
    return actions.join(' ');
  }

  async function setStatus(id, status) {
    if (!confirm('Изменить статус заказа на ' + status + '?')) return;
    try {
      await api('/orders/' + id + '/status', {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      loadOrders(true);
    } catch (err) {
      alert('Ошибка: ' + err.message);
    }
  }

  document.getElementById('nextBtn').onclick = () => {
    if (document.getElementById('nextBtn').disabled) return;
    loadOrders(false);
  };
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); loadOrders(true); }
  });

  async function init() {
    if (!getToken()) {
      location.href = '/login.html?email=merchant@demo.com&next=/merchant-orders.html';
      return;
    }
    loadOrders(true);
  }
  init();
</script>
</body>
</html>
