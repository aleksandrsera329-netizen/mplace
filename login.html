<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace Energy — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/store.css" />
  <link rel="stylesheet" href="assets/css/locale.css" />
  <style>
    .login-wrap {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 28rem;
      margin: 0 auto;
      padding: 48px 16px 80px;
    }
    .login-wrap h1 {
      text-align: center;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 32px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      font-weight: 800;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.7; cursor: wait; }
    .login-error { display: none; color: #f87171; margin-bottom: 12px; font-size: 0.9rem; }
    .login-error.show { display: block; }
    .login-foot {
      margin-top: 24px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .login-foot a { color: var(--primary); }
  </style>
</head>
<body data-theme="dark">
  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="index.html">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button type="button" class="theme-btn" id="themeToggle" title="Theme">🌙</button>
        <div id="localeMount"></div>
        <a class="icon-btn" href="/login" title="Account">👤</a>
        <a class="cart-btn" href="cart.html">🛒 <span data-i18n="nav.cart">Cart</span></a>
      </div>
    </div>
  </header>

  <div class="login-wrap">
    <h1 data-i18n="login.title">Sign in</h1>
    <div id="loginError" class="login-error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email" data-i18n="login.email">Email</label>
        <input class="form-control" type="email" id="email" name="email" required placeholder="email@company.com" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password" data-i18n="login.password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required placeholder="••••••" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn" data-i18n="login.submit">Sign in</button>
    </form>
    <p class="login-foot">
      <a href="index.html" data-i18n="login.storeFront">← Catalog</a>
    </p>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;
    if (!localStorage.getItem('mplace_lang')) I.setLang('en');
    I.mountSwitcher('#localeMount');
    I.applyDocument();

    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      if (themeToggle) themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        setTheme(next);
      });
    }
    setTheme(localStorage.getItem('mplace_theme') || 'dark');

    const form = document.getElementById('loginForm');
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const params = new URLSearchParams(location.search);
    const emailParam = params.get('email');
    if (emailParam && !/@demo\.com$/i.test(emailParam)) {
      document.getElementById('email').value = emailParam;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = I.t('login.signing') || 'Signing in…';
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      try {
        const res = await MplaceApi.login(email, password);
        const user = res.user;
        const role = String(user.role || '').toUpperCase();
        MplaceApi.setSession(res.accessToken, {
          id: user.id,
          email: user.email,
          name: user.name,
          role: role,
          shopId: user.shopId || null,
        });
        const next = params.get('next');
        const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;
        if (role === 'ADMIN' || role === 'SUPER_ADMIN') location.href = safeNext || '/admin/index.html';
        else if (role === 'MERCHANT') location.href = safeNext || '/merchant.html';
        else location.href = safeNext || '/account.html';
      } catch (ex) {
        err.textContent =
          ex.status === 0 || /Failed to fetch|NetworkError|API offline/i.test(ex.message)
            ? (I.t('login.errorApi') || 'Service unavailable. Try again shortly.')
            : (I.t('login.errorCreds') || 'Invalid email or password.');
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = I.t('login.submit') || 'Sign in';
      }
    });
  </script>
</body>
</html>
