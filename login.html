<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace Energy — Login</title>
  <link rel="stylesheet" href="assets/css/admin.css" />
  <link rel="stylesheet" href="assets/css/locale.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-locale" id="localeMount"></div>
    <div class="login-box">
      <div class="login-logo">
        <h1>M<span>place</span> Energy</h1>
        <p data-i18n="app.tagline">Oil & Gas B2B Marketplace</p>
      </div>
      <div class="login-body">
        <h3 data-i18n="login.title">Login</h3>
        <div id="loginError" class="login-error"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="email" data-i18n="login.email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required placeholder="superadmin@demo.com" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password" data-i18n="login.password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required placeholder="••••••" autocomplete="current-password" />
          </div>
          <div class="form-check">
            <input type="checkbox" id="remember" />
            <label for="remember" data-i18n="login.remember">Remember Me</label>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn" data-i18n="login.submit">Login</button>
        </form>
        <div class="login-hints">
          <div><strong data-i18n="login.adminHint">ADMIN</strong><br /><span data-i18n="login.username">Username</span>: <code>superadmin@demo.com</code><br /><span data-i18n="login.passwordLabel">Password</span>: <code>123456</code></div>
          <div style="margin-top:10px"><strong data-i18n="login.merchantHint">MERCHANT</strong><br /><span data-i18n="login.username">Username</span>: <code>merchant@demo.com</code><br /><span data-i18n="login.passwordLabel">Password</span>: <code>123456</code></div>
          <div style="margin-top:10px;color:#888">API: <code id="apiBaseHint">http://127.0.0.1:3000/api</code></div>
        </div>
      </div>
      <div class="login-footer">
        <a href="index.html" data-i18n="login.storeFront">← Store front</a>
        <a href="#" id="regMerchant" data-i18n="login.registerMerchant">Register as merchant</a>
      </div>
    </div>
  </div>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;
    I.mountSwitcher('#localeMount', { className: 'light' });

    const form = document.getElementById('loginForm');
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const params = new URLSearchParams(location.search);
    if (params.get('email')) document.getElementById('email').value = params.get('email');
    document.getElementById('apiBaseHint').textContent = MplaceApi.getBase();

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = I.t('login.signing');
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      try {
        const res = await MplaceApi.login(email, password);
        const user = res.user;
        const role = String(user.role || '').toUpperCase();
        MplaceApi.setSession(res.accessToken, {
          id: user.id,
          email: user.email,
          name: user.name,
          role: role,
          shopId: user.shopId || null,
        });
        if (role === 'ADMIN') location.href = 'admin/index.html';
        else if (role === 'MERCHANT') location.href = 'merchant/index.html';
        else location.href = 'index.html';
      } catch (ex) {
        err.textContent =
          ex.status === 0 || /Failed to fetch|NetworkError|API offline/i.test(ex.message)
            ? I.t('login.errorApi')
            : I.t('login.errorCreds');
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = I.t('login.submit');
      }
    });

    document.getElementById('regMerchant').onclick = (e) => {
      e.preventDefault();
      alert(I.getLang() === 'ru'
        ? 'Демо: регистрация через API POST /auth/register/merchant'
        : I.getLang() === 'ar'
          ? 'تجريبي: التسجيل عبر POST /auth/register/merchant'
          : 'Demo: register via POST /auth/register/merchant');
    };

    window.addEventListener('mplace:locale', () => {
      I.applyDocument();
      if (!btn.disabled) btn.textContent = I.t('login.submit');
    });
  </script>
</body>
</html>
