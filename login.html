<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mplace Energy — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/store.css" />
  <link rel="stylesheet" href="assets/css/admin.css" />
  <link rel="stylesheet" href="assets/css/locale.css" />
  <style>
    html, body { min-height: 100%; }
    body { background: var(--bg) !important; color: var(--text); font-family: Inter, system-ui, sans-serif; }
    .login-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 55%) !important;
      padding: 24px;
    }
    .login-box {
      background: var(--card) !important; border: 1px solid var(--border) !important;
      border-radius: 16px !important; box-shadow: var(--shadow) !important; overflow: hidden;
      width: min(420px, 100%);
    }
    .login-logo { background: transparent !important; border-bottom: 1px solid var(--border); padding: 24px; text-align: center; }
    .login-logo h1 { color: var(--text) !important; font-weight: 800; letter-spacing: -0.03em; }
    .login-logo h1 span { color: var(--primary); }
    .login-logo p, .login-body h3, .login-footer a, .form-group label { color: var(--text-muted) !important; }
    .login-body h3 { color: var(--text) !important; font-weight: 700; }
    .login-body { padding: 24px; }
    .form-control {
      background: var(--bg) !important; border: 1px solid var(--border) !important;
      color: var(--text) !important; border-radius: 10px !important;
    }
    .btn-primary {
      background: var(--primary) !important; color: #000 !important; border: none !important;
      font-weight: 800 !important; border-radius: 12px !important;
    }
    .login-footer { border-top: 1px solid var(--border) !important; background: transparent !important; padding: 16px 24px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .login-note {
      margin-top: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      font-size: 0.85rem; color: var(--text-muted); line-height: 1.45;
    }
    .login-error { display: none; color: #f87171; margin-bottom: 12px; font-size: 0.9rem; }
    .login-error.show { display: block; }
  </style>
</head>
<body data-theme="dark">
  <div class="login-page">
    <div class="login-locale" id="localeMount" style="position:absolute;top:16px;right:16px"></div>
    <div class="login-box">
      <div class="login-logo">
        <h1>M<span>place</span> Energy</h1>
        <p data-i18n="app.tagline">Oil & Gas B2B Marketplace</p>
      </div>
      <div class="login-body">
        <h3 data-i18n="login.title">Sign in</h3>
        <div id="loginError" class="login-error"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="email" data-i18n="login.email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required placeholder="you@company.com" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password" data-i18n="login.password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
          </div>
          <div class="form-check" style="margin:12px 0">
            <input type="checkbox" id="remember" />
            <label for="remember" data-i18n="login.remember">Remember me</label>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn" data-i18n="login.submit">Sign in</button>
        </form>
        <div class="login-note">
          Public demo is browse-only. For a full walkthrough (seller desk, admin, RFQ awards), use
          <a href="request-demo.html" style="color:var(--primary)">Request Private Demo</a>.
        </div>
      </div>
      <div class="login-footer">
        <a href="index.html" data-i18n="login.storeFront">← Catalog</a>
        <a href="request-demo.html">Private demo</a>
      </div>
    </div>
  </div>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const I = window.MplaceI18n;
    if (!localStorage.getItem('mplace_lang')) I.setLang('en');
    I.mountSwitcher('#localeMount', { className: 'light' });
    I.applyDocument();

    const form = document.getElementById('loginForm');
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const params = new URLSearchParams(location.search);
    // Do not prefill demo accounts publicly
    if (params.get('email') && !/@demo\.com$/i.test(params.get('email'))) {
      document.getElementById('email').value = params.get('email');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = I.t('login.signing') || 'Signing in…';
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      try {
        const res = await MplaceApi.login(email, password);
        const user = res.user;
        const role = String(user.role || '').toUpperCase();
        MplaceApi.setSession(res.accessToken, {
          id: user.id,
          email: user.email,
          name: user.name,
          role: role,
          shopId: user.shopId || null,
        });
        const next = params.get('next');
        const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;
        if (role === 'ADMIN' || role === 'SUPER_ADMIN') location.href = safeNext || '/admin/index.html';
        else if (role === 'MERCHANT') location.href = safeNext || '/merchant.html';
        else location.href = safeNext || '/account.html';
      } catch (ex) {
        err.textContent =
          ex.status === 0 || /Failed to fetch|NetworkError|API offline/i.test(ex.message)
            ? (I.t('login.errorApi') || 'Service unavailable. Try again shortly.')
            : (I.t('login.errorCreds') || 'Invalid email or password.');
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = I.t('login.submit') || 'Sign in';
      }
    });
  </script>
</body>
</html>
