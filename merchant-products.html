<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мои товары — Mplace Energy</title>
  <base href="/" />

  <link rel="stylesheet" href="/assets/css/store.css" />
  <link rel="stylesheet" href="/assets/css/locale.css" />

  <style>
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-header h1 {
      font-size: 1.9rem;
      font-weight: 800;
    }

    .btn-create {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-create:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
    }

    .products-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .products-table th {
      text-align: left;
      padding: 16px;
      background: var(--bg);
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }

    .products-table td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .products-table tr:last-child td {
      border-bottom: none;
    }

    .product-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .product-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-ACTIVE { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-DRAFT { background: rgba(156, 163, 175, 0.15); color: #9ca3af; }
    .status-ARCHIVED { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-sm:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
    }
    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    @media (max-width: 700px) {
      .products-table {
        display: block;
      }
      .products-table thead {
        display: none;
      }
      .products-table tr {
        display: block;
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      .products-table td {
        display: block;
        padding: 4px 0;
        border: none;
      }
    }
  </style>
</head>
<body>

  <header class="store-header">
    <div class="header-top">
      <a class="logo" href="/">M<span>place</span> Energy</a>
      <div class="header-actions">
        <button class="theme-btn" id="themeToggle">🌙</button>
        <div id="localeMount"></div>
        <a href="/merchant.html" class="cart-btn" style="text-decoration:none;">← Кабинет</a>
      </div>
    </div>
  </header>

  <div class="page">
    <div class="page-header">
      <h1>Мои товары</h1>
      <button class="btn-create" onclick="openCreateModal()">+ Добавить товар</button>
    </div>

    <div id="productsContent">
      <div style="text-align:center; padding:60px 0; opacity:0.6;">Загрузка товаров...</div>
    </div>
  </div>

  <!-- Modal создания товара -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <h2>Новый товар</h2>

      <div class="form-group">
        <label>Название *</label>
        <input type="text" id="newName" placeholder="Например: Gate Valve 6&quot; Class 600">
      </div>

      <div class="form-group">
        <label>Описание</label>
        <textarea id="newDescription" placeholder="Краткое описание товара"></textarea>
      </div>

      <div class="form-group">
        <label>Цена (в центах USD) *</label>
        <input type="number" id="newPrice" placeholder="например 125000 = $1250">
      </div>

      <div class="form-group">
        <label>Остаток на складе *</label>
        <input type="number" id="newStock" value="10" min="0">
      </div>

      <div class="form-group">
        <label>SKU</label>
        <input type="text" id="newSku" placeholder="Необязательно">
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeCreateModal()">Отмена</button>
        <button class="btn-primary" onclick="createProduct()">Создать</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>

  <script>
    const I = window.MplaceI18n;

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('mplace_theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.onclick = () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    };
    setTheme(localStorage.getItem('mplace_theme') || 'dark');
    I.mountSwitcher('#localeMount');

    let allProducts = [];
    // Auth gate
    (function() {
      const token = MplaceApi.getToken && MplaceApi.getToken();
      const user = MplaceApi.getUser && MplaceApi.getUser();
      const role = String(user?.role || '').toUpperCase();
      if (!token || !user || (!['MERCHANT','ADMIN','SUPER_ADMIN'].includes(role) && !user.shopId)) {
        document.getElementById('productsContent').innerHTML = `
          <div class="empty-state">
            <h3>Доступ только для поставщиков</h3>
            <p style="margin:12px 0 20px"><a href="/login.html?email=merchant@demo.com&next=/merchant-products.html" style="color:var(--primary)">Войти как поставщик</a></p>
          </div>`;
        window.__authBlocked = true; return;
      }
    })();


    async function loadProducts() {
      try {
        const res = await MplaceApi.products();
        allProducts = Array.isArray(res) ? res : (res.items || []);
        renderProducts();
      } catch (err) {
        console.error(err);
        document.getElementById('productsContent').innerHTML = `
          <div class="empty-state">
            <p>Не удалось загрузить товары</p>
            <button class="btn-create" onclick="loadProducts()">Попробовать снова</button>
          </div>
        `;
      }
    }

    function renderProducts() {
      const content = document.getElementById('productsContent');

      if (allProducts.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div style="font-size:3rem; margin-bottom:16px; opacity:0.5;">📦</div>
            <h3>У вас пока нет товаров</h3>
            <p style="margin:12px 0 24px;">Создайте первый товар, чтобы начать получать заявки</p>
            <button class="btn-create" onclick="openCreateModal()">+ Добавить товар</button>
          </div>
        `;
        return;
      }

      content.innerHTML = `
        <table class="products-table">
          <thead>
            <tr>
              <th>Товар</th>
              <th>Цена</th>
              <th>Остаток</th>
              <th>Статус</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${allProducts.map(p => `
              <tr>
                <td>
                  <div class="product-name">${p.name}</div>
                  <div class="product-meta">${p.sku || 'Без SKU'} · ${p.category?.name || ''}</div>
                </td>
                <td style="font-weight:700;">${I.formatMoney(p.priceCents)}</td>
                <td>${p.stock}</td>
                <td><span class="status-badge status-${p.status || 'ACTIVE'}">${p.status || 'ACTIVE'}</span></td>
                <td>
                  <div class="actions">
                    <button class="btn-sm" onclick="alert('Редактирование будет в следующей версии')">Изменить</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function openCreateModal() {
      document.getElementById('createModal').classList.add('open');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('open');
    }

    async function createProduct() {
      const name = document.getElementById('newName').value.trim();
      const description = document.getElementById('newDescription').value.trim();
      const priceCents = parseInt(document.getElementById('newPrice').value);
      const stock = parseInt(document.getElementById('newStock').value);
      const sku = document.getElementById('newSku').value.trim();

      if (!name || !priceCents || priceCents <= 0) {
        alert('Заполните название и корректную цену');
        return;
      }

      try {
        await MplaceApi.createProduct({
          name,
          description: description || undefined,
          priceCents: priceCents,
          stock: isNaN(stock) ? 0 : stock,
          sku: sku || undefined,
          status: 'ACTIVE'
        });

        closeCreateModal();
        // Очистка формы
        document.getElementById('newName').value = '';
        document.getElementById('newDescription').value = '';
        document.getElementById('newPrice').value = '';
        document.getElementById('newStock').value = '10';
        document.getElementById('newSku').value = '';

        await loadProducts();
        alert('Товар успешно создан');
      } catch (err) {
        console.error(err);
        alert('Ошибка при создании товара. Проверьте данные и права доступа.');
      }
    }

    // Закрытие модалки по клику вне
    document.getElementById('createModal').addEventListener('click', (e) => {
      if (e.target.id === 'createModal') closeCreateModal();
    });

    if (!window.__authBlocked) if (
